      {/* Create-schedule form */}
      {showForm&&(()=>{
        const PRESETS=[
          {f:'WEEKLY',   days:7,   emoji:'📅', label:'Weekly',    run:'Runs every 7 days',        cover:'Last 7 days of audit events',   accent:'#6366F1', bg:'#EEF2FF'},
          {f:'MONTHLY',  days:30,  emoji:'📆', label:'Monthly',   run:'Runs every 30 days',       cover:'Last 30 days of audit events',  accent:'#0284C7', bg:'#E0F2FE'},
          {f:'QUARTERLY',days:90,  emoji:'🗓', label:'Quarterly', run:'Runs every 90 days',       cover:'Last 90 days of audit events',  accent:'#059669', bg:'#DCFCE7'},
          {f:'CUSTOM',   days:14,  emoji:'⚙️', label:'Custom',    run:'You set the interval',     cover:'You set the window',            accent:'#9333EA', bg:'#F5F3FF'},
        ];
        const isCustom=form.frequency==='CUSTOM';
        const preset=PRESETS.find(p=>p.f===form.frequency)||PRESETS[0];
        const defaultDays={WEEKLY:7,MONTHLY:30,QUARTERLY:90};
        const inputBase={width:'100%',padding:'10px 14px',border:'1.5px solid #E2E8F0',borderRadius:10,
                         fontSize:14,color:'#0F172A',outline:'none',boxSizing:'border-box',background:'#fff'};
        const labelStyle={fontSize:11,fontWeight:700,color:'#64748B',display:'block',
                          marginBottom:7,textTransform:'uppercase',letterSpacing:'.06em'};
        return(
          <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:16,padding:28,
                       marginBottom:24,boxShadow:'0 4px 24px rgba(15,23,42,.07)'}}>

            {/* Header */}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24}}>
              <div>
                <div style={{fontWeight:700,fontSize:16,color:'#0F172A'}}>New Report Schedule</div>
                <div style={{fontSize:12,color:'#64748B',marginTop:3}}>
                  Frequency and coverage are always kept in sync - no mismatch possible.
                </div>
              </div>
              <button onClick={()=>setShowForm(false)}
                style={{background:'none',border:'none',cursor:'pointer',color:'#94A3B8',
                        fontSize:20,lineHeight:1,padding:'0 2px'}}>✕</button>
            </div>

            {/* Schedule name */}
            <div style={{marginBottom:22}}>
              <label style={labelStyle}>Schedule Name</label>
              <input style={inputBase} placeholder="e.g. Weekly HIPAA Audit Report"
                value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
            </div>

            {/* Frequency cards */}
            <div style={{marginBottom:22}}>
              <label style={labelStyle}>Frequency & Default Coverage</label>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
                {PRESETS.map(opt=>{
                  const sel=form.frequency===opt.f;
                  return(
                    <div key={opt.f}
                      onClick={()=>setForm(f=>({...f,frequency:opt.f,include_period_days:opt.days,customPeriod:opt.f==='CUSTOM'}))}
                      style={{border:`2px solid ${sel?opt.accent:'#E2E8F0'}`,borderRadius:14,padding:'18px 16px',
                              cursor:'pointer',background:sel?opt.bg:'#FAFAFA',
                              transition:'border-color .15s,background .15s',
                              boxShadow:sel?`0 0 0 4px ${opt.accent}18`:'none'}}>
                      <div style={{fontSize:24,marginBottom:8}}>{opt.emoji}</div>
                      <div style={{fontWeight:700,fontSize:15,color:sel?opt.accent:'#0F172A',marginBottom:3}}>
                        {opt.label}
                      </div>
                      <div style={{fontSize:11,color:'#64748B',marginBottom:10}}>{opt.run}</div>
                      <div style={{fontSize:11,fontWeight:600,
                                   color:sel?opt.accent:'#64748B',
                                   background:sel?`${opt.accent}18`:'#F1F5F9',
                                   borderRadius:6,padding:'5px 9px',display:'inline-block'}}>
                        {opt.cover}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Coverage window */}
            <div style={{marginBottom:22,borderRadius:12,padding:'14px 16px',
                         background:isCustom?'#F5F3FF':'#F8FAFC',
                         border:`1px solid ${isCustom?'#D8B4FE':'#E2E8F0'}`}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:isCustom?14:0}}>
                <span style={{fontSize:13,fontWeight:700,color:isCustom?'#9333EA':'#94A3B8'}}>
                  Customize coverage window
                </span>
                {!isCustom&&(
                  <span style={{fontSize:11,color:'#94A3B8',fontStyle:'italic'}}>
                    - locked to {defaultDays[form.frequency]} days for {form.frequency.toLowerCase()} schedules.
                    Select <b>Custom</b> to set a different window.
                  </span>
                )}
              </div>

              {isCustom&&(
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:10}}>
                    <input type="range" min={1} max={365} value={form.include_period_days}
                      onChange={e=>setForm(f=>({...f,include_period_days:parseInt(e.target.value)}))}
                      style={{flex:1,accentColor:'#9333EA',height:4}}/>
                    <div style={{minWidth:72,background:'#fff',border:'1.5px solid #D8B4FE',borderRadius:8,
                                 padding:'6px 10px',textAlign:'center',fontSize:14,fontWeight:700,color:'#9333EA'}}>
                      {form.include_period_days}d
                    </div>
                  </div>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    {[7,14,30,60,90,180].map(d=>(
                      <button key={d} onClick={()=>setForm(f=>({...f,include_period_days:d}))}
                        style={{padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:600,cursor:'pointer',
                                border:`1.5px solid ${form.include_period_days===d?'#9333EA':'#E2E8F0'}`,
                                background:form.include_period_days===d?'#9333EA':'#fff',
                                color:form.include_period_days===d?'#fff':'#64748B'}}>
                        {d}d
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Recipient email */}
            <div style={{marginBottom:22}}>
              <label style={labelStyle}>
                Recipient Email
                <span style={{fontWeight:400,fontSize:10,textTransform:'none',letterSpacing:0,
                              color:'#94A3B8',marginLeft:6}}>optional - emailed after each run</span>
              </label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',
                              fontSize:15,color:'#94A3B8',pointerEvents:'none'}}>✉</span>
                <input type="email" style={{...inputBase,paddingLeft:36}}
                  placeholder="compliance@clinic.example"
                  value={form.recipient_email}
                  onChange={e=>setForm(f=>({...f,recipient_email:e.target.value}))}/>
              </div>
            </div>

            {/* Live preview */}
            <div style={{background:preset.bg,border:`1px solid ${preset.accent}40`,borderRadius:12,
                         padding:'16px 18px',marginBottom:22}}>
              <div style={{fontSize:10,fontWeight:800,color:preset.accent,textTransform:'uppercase',
                           letterSpacing:'.08em',marginBottom:8}}>Schedule Preview</div>
              <div style={{fontSize:13,color:'#0F172A',lineHeight:1.7}}>
                <span style={{fontWeight:700}}>{form.name||'(unnamed schedule)'}</span>
                {' '}will run{' '}
                <span style={{fontWeight:700,color:preset.accent}}>
                  {isCustom?`every ${form.include_period_days} days (custom)`:preset.run.toLowerCase()}
                </span>
                {' '}and each report will cover the last{' '}
                <span style={{fontWeight:700,color:preset.accent}}>{form.include_period_days} days</span>
                {' '}of audit events.
                {form.recipient_email&&(
                  <span> A copy will be emailed to{' '}
                    <span style={{fontWeight:700}}>{form.recipient_email}</span>.
                  </span>
                )}
              </div>
            </div>

            {/* Actions */}
            <div style={{display:'flex',gap:10}}>
              <button className="btn-primary" onClick={createSchedule}
                style={{padding:'10px 24px',fontSize:14}}>
                Create Schedule
              </button>
              <button className="btn-outline" onClick={()=>setShowForm(false)}
                style={{padding:'10px 20px',fontSize:14}}>
                Cancel
              </button>
            </div>

          </div>
        );
      })()}

      {/* Schedules */}
      <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:12,marginBottom:24,overflow:'hidden'}}>
        <div style={{padding:'13px 24px',background:'#F8FAFC',borderBottom:'1px solid #E2E8F0',
                     fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'#475569'}}>
          Scheduled Reports
        </div>
        {schedules.length===0?(
          <div style={{padding:32,textAlign:'center',color:'#94A3B8',fontSize:13}}>
            No schedules yet - create one above or run an ad-hoc report.
          </div>
        ):(
          <table>
            <thead>
              <tr>
                <th>Name</th><th>Frequency</th><th>Coverage</th><th>Sync</th>
                <th>Recipient</th><th>Last Run</th><th>Next Run</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody>
              {schedules.map(s=>{
                const defaultDays={WEEKLY:7,MONTHLY:30,QUARTERLY:90};
                const synced=s.frequency==='CUSTOM'||s.include_period_days===defaultDays[s.frequency];
                return(
                <tr key={s.id}>
                  <td style={{fontWeight:600}}>{s.name}</td>
                  <td>
                    <span style={{background:freqColors[s.frequency]||'#64748B',color:'#fff',
                                  padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>
                      {s.frequency}
                    </span>
                  </td>
                  <td style={{fontSize:12,color:'#64748B'}}>Last {s.include_period_days} days</td>
                  <td>
                    <span title={synced?'Coverage matches frequency':'Coverage window differs from run interval'}
                      style={{fontSize:13}}>{synced?'✅':'⚠️'}</span>
                  </td>
                  <td style={{fontSize:12,color:'#64748B'}}>{s.recipient_email||'-'}</td>
                  <td style={{fontSize:11,color:'#94A3B8'}}>{s.last_run_at?new Date(s.last_run_at).toLocaleDateString():'Never'}</td>
                  <td style={{fontSize:11,color:'#94A3B8'}}>{s.next_run_at?new Date(s.next_run_at).toLocaleDateString():'-'}</td>
                  <td>
                    <span style={{background:s.is_active?'#DCFCE7':'#F1F5F9',
                                  color:s.is_active?'#166534':'#64748B',
                                  padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>
                      {s.is_active?'ACTIVE':'PAUSED'}
                    </span>
                  </td>
                  <td>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn-outline" style={{padding:'3px 10px',fontSize:11}}
                        onClick={()=>runSchedule(s.id)} disabled={runLoading}>Run Now</button>
                      <button style={{background:'#FEE2E2',color:'#991B1B',border:'none',borderRadius:6,
                                     padding:'3px 10px',fontSize:11,cursor:'pointer'}}
                        onClick={()=>deleteSchedule(s.id)}>Delete</button>
                    </div>
                  </td>
                </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {/* History */}
      <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:12,overflow:'hidden'}}>
        <div style={{padding:'13px 24px',background:'#F8FAFC',borderBottom:'1px solid #E2E8F0',
                     fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'.08em',color:'#475569'}}>
          Report History
        </div>
        {loading&&history.length===0?(
          <div style={{padding:32,textAlign:'center',color:'#94A3B8'}}>Loading…</div>
        ):history.length===0?(
          <div style={{padding:32,textAlign:'center',color:'#94A3B8',fontSize:13}}>No reports generated yet.</div>
        ):(
          <table>
            <thead>
              <tr>
                <th>Type</th><th>Schedule</th><th>Period</th><th>Generated At</th>
                <th>By</th><th>Size</th><th>Status</th><th></th>
              </tr>
            </thead>
            <tbody>
              {history.map(r=>(
                <tr key={r.id}>
                  <td>
                    <span style={{background:freqColors[r.report_type]||'#64748B',color:'#fff',
                                  padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>
                      {r.report_type}
                    </span>
                  </td>
                  <td style={{fontSize:12}}>{r.schedule_name||'-'}</td>
                  <td style={{fontSize:12,color:'#64748B'}}>{r.period_days}d</td>
                  <td style={{fontSize:11,color:'#64748B'}}>
                    {r.generated_at?new Date(r.generated_at).toLocaleString():'-'}
                  </td>
                  <td style={{fontSize:11,color:'#64748B'}}>{r.generated_by}</td>
                  <td style={{fontSize:11,color:'#94A3B8'}}>
                    {r.file_size_bytes?`${(r.file_size_bytes/1024).toFixed(1)} KB`:'-'}
                  </td>
                  <td>
                    <span style={{background:r.status==='SUCCESS'?'#DCFCE7':r.status==='FAILED'?'#FEE2E2':'#FEF9C3',
                                  color:r.status==='SUCCESS'?'#166534':r.status==='FAILED'?'#991B1B':'#854D0E',
                                  padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>
                      {r.status}
                    </span>
                  </td>
                  <td>
                    {r.status==='SUCCESS'&&(
                      <div>
                        <div style={{display:'flex',gap:4}}>
                          <button className="btn-outline" style={{padding:'3px 8px',fontSize:11}}
                            onClick={()=>viewReport(r.id)}>View</button>
                          <button className="btn-outline" style={{padding:'3px 8px',fontSize:11}}
                            onClick={()=>downloadPdf(r.id)}>Save PDF</button>
                          <button className="btn-outline" style={{padding:'3px 8px',fontSize:11}}
                            onClick={()=>{setEmailRow(emailRow===r.id?null:r.id);setEmailAddr('');}}>
                            Email
                          </button>
                        </div>
                        {emailRow===r.id&&(
                          <div style={{display:'flex',gap:4,marginTop:5}}>
                            <input type="email" placeholder="recipient@example.com"
                              style={{padding:'3px 8px',border:'1px solid #CBD5E1',borderRadius:6,fontSize:11,width:170}}
                              value={emailAddr} onChange={e=>setEmailAddr(e.target.value)}
                              onKeyDown={e=>e.key==='Enter'&&sendEmail(r.id,emailAddr)}/>
                            <button className="btn-primary" style={{padding:'3px 10px',fontSize:11}}
                              onClick={()=>sendEmail(r.id,emailAddr)}>Send</button>
                            <button className="btn-outline" style={{padding:'3px 6px',fontSize:11}}
                              onClick={()=>setEmailRow(null)}>✕</button>
                          </div>
                        )}
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

    </div>
  );
}

// ─── Admin Pages ─────────────────────────────────────────────────────────────

const ROLE_META={
  TRUSTPULSE_ADMIN:   {color:'#7C3AED',label:'Admin'},
  COMPLIANCE_OFFICER: {color:'#0369A1',label:'Compliance Officer'},
  AUDITOR:            {color:'#15803D',label:'Auditor'},
  SECURITY_ADMIN:     {color:'#B45309',label:'Security Admin'},
};
const ALL_ROLES=Object.keys(ROLE_META);
const PERM_LABELS={
  review:'Review Cases',disposition:'Disposition Cases',export:'Export Evidence',
  breach_assessment:'Breach Assessment',configure:'Configure Connector',trigger_ingestion:'Trigger Ingestion',
};

function AdminUsersPage(){
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [msg,setMsg]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({email:'',display_name:'',role:'COMPLIANCE_OFFICER',password:''});
  const [editId,setEditId]=useState(null);
  const [editRole,setEditRole]=useState('');

  const load=()=>{
    setLoading(true);
    apiFetch('/api/admin/users').then(d=>{setUsers(d.users||[]);setLoading(false)}).catch(()=>setLoading(false));
  };
  useEffect(()=>{load();},[]);

  const flash=(m,ok=true)=>{setMsg({m,ok});setTimeout(()=>setMsg(null),3500);};

  const createUser=async()=>{
    if(!form.email||!form.password){flash('Email and password required',false);return;}
    const r=await apiFetch('/api/admin/users',{method:'POST',body:form});
    if(r&&r.id){flash('User created');setShowForm(false);setForm({email:'',display_name:'',role:'COMPLIANCE_OFFICER',password:''});load();}
    else flash('Failed to create user',false);
  };

  const toggleActive=async(u)=>{
    const r=await apiFetch(`/api/admin/users/${u.id}`,{method:'PATCH',body:{is_active:!u.is_active}});
    if(r&&r.id){flash(`User ${r.is_active?'activated':'deactivated'}`);load();}
    else flash('Update failed',false);
  };

  const saveRole=async(uid)=>{
    const r=await apiFetch(`/api/admin/users/${uid}`,{method:'PATCH',body:{role:editRole}});
    if(r&&r.id){flash('Role updated');setEditId(null);load();}
    else flash('Update failed',false);
  };

  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      {msg&&<div style={{marginBottom:16,padding:'10px 16px',borderRadius:8,background:msg.ok?'#F0FDF4':'#FEF2F2',border:`1px solid ${msg.ok?'#86EFAC':'#FCA5A5'}`,color:msg.ok?'#15803D':'#DC2626',fontSize:13}}>{msg.m}</div>}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:'#1E293B'}}>TrustPulse Platform Users</div>
          <div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>Accounts with access to this TrustPulse instance</div>
        </div>
        <button className="btn-primary" onClick={()=>setShowForm(s=>!s)}>{showForm?'Cancel':'+ New User'}</button>
      </div>

      {showForm&&(
        <div className="card" style={{padding:'20px 24px',marginBottom:20,borderLeft:'4px solid #6366F1'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#1E293B',marginBottom:14}}>Create New User</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
            <div>
              <label style={{fontSize:11,fontWeight:600,color:'#64748B',display:'block',marginBottom:4}}>Email *</label>
              <input className="input" placeholder="user@clinic.local" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/>
            </div>
            <div>
              <label style={{fontSize:11,fontWeight:600,color:'#64748B',display:'block',marginBottom:4}}>Display Name</label>
              <input className="input" placeholder="Dr. Jane Smith" value={form.display_name} onChange={e=>setForm(f=>({...f,display_name:e.target.value}))}/>
            </div>
            <div>
              <label style={{fontSize:11,fontWeight:600,color:'#64748B',display:'block',marginBottom:4}}>Role *</label>
              <select className="input" value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
                {ALL_ROLES.map(r=><option key={r} value={r}>{ROLE_META[r]?.label||r}</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:11,fontWeight:600,color:'#64748B',display:'block',marginBottom:4}}>Password * (min 8 chars)</label>
              <input className="input" type="password" placeholder="••••••••" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))}/>
            </div>
          </div>
          <button className="btn-primary" onClick={createUser}>Create User</button>
        </div>
      )}

      {loading?<Spinner/>:(
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead>
              <tr style={{background:'#F8FAFC',borderBottom:'2px solid #E2E8F0'}}>
                {['User','Email','Role','Status','Last Login','Actions'].map(h=>(
                  <th key={h} style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {users.map(u=>{
                const rm=ROLE_META[u.role]||{color:'#6B7280',label:u.role};
                return(
                  <tr key={u.id} style={{borderBottom:'1px solid #F1F5F9',opacity:u.is_active?1:.55}}>
                    <td style={{padding:'12px 14px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <div style={{width:32,height:32,borderRadius:'50%',background:rm.color+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:rm.color,flexShrink:0}}>
                          {(u.display_name||u.email)[0].toUpperCase()}
                        </div>
                        <span style={{fontWeight:600,color:'#1E293B'}}>{u.display_name||'-'}</span>
                      </div>
                    </td>
                    <td style={{padding:'12px 14px',color:'#64748B',fontFamily:'monospace',fontSize:12}}>{u.email}</td>
                    <td style={{padding:'12px 14px'}}>
                      {editId===u.id?(
                        <div style={{display:'flex',gap:6,alignItems:'center'}}>
                          <select className="input" style={{fontSize:12,padding:'4px 6px'}} value={editRole} onChange={e=>setEditRole(e.target.value)}>
                            {ALL_ROLES.map(r=><option key={r} value={r}>{ROLE_META[r]?.label||r}</option>)}
                          </select>
                          <button className="btn-primary" style={{padding:'4px 10px',fontSize:11}} onClick={()=>saveRole(u.id)}>Save</button>
                          <button style={{fontSize:11,color:'#64748B',background:'none',border:'none',cursor:'pointer'}} onClick={()=>setEditId(null)}>Cancel</button>
                        </div>
                      ):(
                        <span style={{display:'inline-flex',alignItems:'center',gap:6,cursor:'pointer'}} onClick={()=>{setEditId(u.id);setEditRole(u.role);}}>
                          <span style={{background:rm.color+'18',color:rm.color,borderRadius:6,padding:'2px 8px',fontSize:11,fontWeight:700}}>{rm.label}</span>
                          <span style={{fontSize:10,color:'#94A3B8'}}>✏</span>
                        </span>
                      )}
                    </td>
                    <td style={{padding:'12px 14px'}}>
                      <span style={{background:u.is_active?'#F0FDF4':'#F8FAFC',color:u.is_active?'#15803D':'#94A3B8',borderRadius:6,padding:'2px 10px',fontSize:11,fontWeight:700,border:`1px solid ${u.is_active?'#86EFAC':'#E2E8F0'}`}}>
                        {u.is_active?'Active':'Inactive'}
                      </span>
                    </td>
                    <td style={{padding:'12px 14px',color:'#64748B',fontSize:12}}>{u.last_login?fmtTime(u.last_login):'Never'}</td>
                    <td style={{padding:'12px 14px'}}>
                      <button onClick={()=>toggleActive(u)} style={{fontSize:11,padding:'4px 12px',borderRadius:6,border:'1px solid #E2E8F0',background:u.is_active?'#FEF2F2':'#F0FDF4',color:u.is_active?'#DC2626':'#15803D',cursor:'pointer',fontWeight:600}}>
                        {u.is_active?'Deactivate':'Activate'}
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      <div style={{marginTop:14,fontSize:11,color:'#94A3B8'}}>
        Deactivate a user before removing access. Deactivated users cannot log in but their audit trail is preserved.
      </div>
    </div>
  );
}

function AdminPermissionsPage(){
  const [groups,setGroups]=useState([]);
  useEffect(()=>{apiFetch('/api/admin/permission-groups').then(d=>setGroups(d.groups||[])).catch(()=>{});},[]);
  const allPerms=Object.keys(PERM_LABELS);
  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:14,fontWeight:700,color:'#1E293B'}}>Permission Groups</div>
        <div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>TrustPulse uses role-based access control. Each role is a permission group with a fixed set of capabilities.</div>
      </div>

      {/* Permission matrix */}
      <div className="card" style={{padding:0,overflow:'hidden',marginBottom:20}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead>
            <tr style={{background:'#F8FAFC',borderBottom:'2px solid #E2E8F0'}}>
              <th style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',minWidth:160}}>Permission</th>
              {ALL_ROLES.map(r=>{
                const rm=ROLE_META[r]||{};
                return(
                  <th key={r} style={{padding:'10px 14px',textAlign:'center',fontSize:11,fontWeight:700,color:rm.color,textTransform:'uppercase',letterSpacing:'.06em'}}>
                    {rm.label||r}
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {allPerms.map(perm=>(
              <tr key={perm} style={{borderBottom:'1px solid #F1F5F9'}}>
                <td style={{padding:'10px 14px',fontWeight:600,color:'#1E293B'}}>{PERM_LABELS[perm]||perm}</td>
                {ALL_ROLES.map(role=>{
                  const g=groups.find(x=>x.role===role);
                  const has=g&&g.permissions.includes(perm);
                  return(
                    <td key={role} style={{padding:'10px 14px',textAlign:'center'}}>
                      {has
                        ?<span style={{color:'#15803D',fontWeight:700,fontSize:15}}>✓</span>
                        :<span style={{color:'#E2E8F0',fontSize:15}}>-</span>
                      }
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Role cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14}}>
        {groups.map(g=>{
          const rm=ROLE_META[g.role]||{color:'#6B7280',label:g.role};
          return(
            <div key={g.role} className="card" style={{padding:'18px 20px',borderLeft:`4px solid ${rm.color}`}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <span style={{background:rm.color+'18',color:rm.color,borderRadius:6,padding:'3px 10px',fontSize:12,fontWeight:700}}>{rm.label}</span>
              </div>
              <p style={{fontSize:12,color:'#64748B',marginBottom:12,lineHeight:1.5}}>{g.description}</p>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {g.permissions.map(p=>(
                  <span key={p} style={{background:'#F1F5F9',color:'#475569',borderRadius:99,padding:'2px 8px',fontSize:11}}>{PERM_LABELS[p]||p}</span>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{marginTop:20,background:'#F0F4FF',border:'1px solid #C7D2FE',borderRadius:10,padding:'14px 18px'}}>
        <div style={{fontSize:11,fontWeight:700,color:'#4338CA',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>About TrustPulse RBAC</div>
        <div style={{fontSize:12,color:'#4338CA',lineHeight:1.6}}>
          TrustPulse uses role-based access control with four built-in roles. Roles are assigned per user - a user belongs to exactly one role.
          Roles cannot be customised in this version; each role maps to a fixed permission set enforced server-side on every API call.
          User Group layering (multiple roles per user, query-scoped access) is a planned future capability.
        </div>
      </div>
    </div>
  );
}

function AdminSettingsPage(){
  const [settings,setSettings]=useState({});
  const [form,setForm]=useState({});
  const [msg,setMsg]=useState(null);
  const [testing,setTesting]=useState(false);
  const [testResult,setTestResult]=useState(null);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    apiFetch('/api/admin/settings').then(d=>{
      setSettings(d||{});
      const vals={};
      Object.entries(d||{}).forEach(([k,v])=>vals[k]=v.value||'');
      setForm(vals);
    }).catch(()=>{});
  },[]);

  const flash=(m,ok=true)=>{setMsg({m,ok});setTimeout(()=>setMsg(null),4000);};

  const testConn=async()=>{
    setTesting(true);setTestResult(null);
    try{
      const r=await apiFetch('/api/admin/settings/test-connection',{method:'POST',body:{openemr_db_url:form.openemr_db_url}});
      setTestResult(r?.connected?'success':'fail');
      if(!r?.connected) flash('Connection failed - check the URL and credentials',false);
      else flash('Connection successful');
    }catch(e){setTestResult('fail');flash('Connection failed: '+(e?.message||'unknown error'),false);}

  };

  const save=async()=>{
    setSaving(true);
    try{
      const r=await apiFetch('/api/admin/settings',{method:'PUT',body:form});
      if(r?.saved){
        flash('Settings saved');
        if(r.saved.includes('openemr_db_url')){
          apiFetch('/api/admin/settings/apply-connection',{method:'POST'})
            .then(x=>x?.connected&&flash('OpenEMR connector reconnected'))
            .catch(()=>{});

      } else flash('Save failed',false);
    }catch(e){flash('Save failed: '+(e?.message||'unknown error'),false);}
    finally{setSaving(false);}

  const FIELD_META={

      {msg&&<div style={{marginBottom:16,padding:'10px 16px',borderRadius:8,background:msg.ok?'#F0FDF4':'#FEF2F2',border:`1px solid ${msg.ok?'#86EFAC':'#FCA5A5'}`,color:msg.ok?'#15803D':'#DC2626',fontSize:13}}>{msg.m}</div>}

      <div className="card" style={{padding:'22px 26px',marginBottom:20}}>
        <div style={{fontSize:14,fontWeight:700,color:'#1E293B',marginBottom:4}}>OpenEMR Connection &amp; Configuration</div>
        <div style={{fontSize:12,color:'#94A3B8',marginBottom:20}}>Changes are saved to TrustPulse's internal settings. OpenEMR connection updates apply immediately; ingestion interval updates take effect on the next poll cycle.</div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          {Object.entries(FIELD_META).map(([key,meta])=>(
            <div key={key} style={{gridColumn:meta.full?'span 2':'auto'}}>
              <label style={{fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:6}}>{meta.label}</label>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <input
                  className="input"
                  type={meta.type==='password'?'text':meta.type||'text'}

function AdminPrivacyPage(){
  const [config,setConfig]=useState({module_enabled:false,obfuscated_fields:[],maskable_fields:{}});
  const [requests,setRequests]=useState([]);
  const [msg,setMsg]=useState(null);
  const [saving,setSaving]=useState(false);

  const load=()=>{
    apiFetch('/api/admin/privacy/config').then(d=>setConfig(d||{})).catch(()=>{});
    apiFetch('/api/admin/privacy/requests').then(d=>setRequests(d?.requests||[])).catch(()=>{});
  };
  useEffect(()=>{load();},[]);

  const flash=(m,ok=true)=>{setMsg({m,ok});setTimeout(()=>setMsg(null),3500);};

  const toggleField=async(field)=>{
    const cur=config.obfuscated_fields||[];
    const next=cur.includes(field)?cur.filter(f=>f!==field):[...cur,field];
    const r=await apiFetch('/api/admin/privacy/config',{method:'PUT',body:{module_enabled:config.module_enabled,obfuscated_fields:next}});
    if(r){setConfig(c=>({...c,obfuscated_fields:next}));flash('Fields updated');}
    else flash('Update failed',false);
  };

  const toggleModule=async()=>{
    const next=!config.module_enabled;
    setSaving(true);
    const r=await apiFetch('/api/admin/privacy/config',{method:'PUT',body:{module_enabled:next,obfuscated_fields:config.obfuscated_fields||[]}});
    setSaving(false);
    if(r){setConfig(c=>({...c,module_enabled:next}));flash(`Data Privacy ${next?'enabled':'disabled'}`);}
    else flash('Update failed',false);
  };

  const decide=async(id,decision,denied_reason='')=>{
    const r=await apiFetch(`/api/admin/privacy/requests/${id}/decide`,{method:'PATCH',body:{decision,denied_reason}});
    if(r){flash(`Request ${decision.toLowerCase()}`);load();}
    else flash('Action failed',false);
  };

  const statusColor={PENDING:'#92400E',APPROVED:'#15803D',DENIED:'#DC2626',EXPIRED:'#94A3B8'};
  const statusBg={PENDING:'#FFFBEB',APPROVED:'#F0FDF4',DENIED:'#FEF2F2',EXPIRED:'#F8FAFC'};
  const pending=requests.filter(r=>r.status==='PENDING');
  const history=requests.filter(r=>r.status!=='PENDING');

  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      {msg&&<div style={{marginBottom:16,padding:'10px 16px',borderRadius:8,background:msg.ok?'#F0FDF4':'#FEF2F2',border:`1px solid ${msg.ok?'#86EFAC':'#FCA5A5'}`,color:msg.ok?'#15803D':'#DC2626',fontSize:13}}>{msg.m}</div>}

      {/* Module toggle */}
      <div className="card" style={{padding:'20px 24px',marginBottom:20,borderLeft:`4px solid ${config.module_enabled?'#6366F1':'#E2E8F0'}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:'#1E293B'}}>Data Privacy Module</div>
            <div style={{fontSize:12,color:'#64748B',marginTop:4,maxWidth:560,lineHeight:1.6}}>
              When enabled, selected log fields are masked for users without approved access.
              Users can request access to view protected values. Access must be explicitly authorised by an administrator before any masked value is revealed.
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8,flexShrink:0,marginLeft:20}}>
            <button onClick={toggleModule} disabled={saving} style={{padding:'8px 20px',borderRadius:8,border:'none',cursor:'pointer',fontWeight:700,fontSize:13,background:config.module_enabled?'#EF4444':'#6366F1',color:'#fff'}}>
              {config.module_enabled?'Disable':'Enable'}
            </button>
            <span style={{fontSize:11,fontWeight:700,color:config.module_enabled?'#15803D':'#94A3B8'}}>
              {config.module_enabled?'● Active':'○ Inactive'}
            </span>
          </div>
        </div>
      </div>

      {/* Field selection */}
      <div className="card" style={{padding:'20px 24px',marginBottom:20,opacity:config.module_enabled?1:.5,pointerEvents:config.module_enabled?'auto':'none'}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1E293B',marginBottom:4}}>Fields to Obfuscate</div>
        <div style={{fontSize:12,color:'#94A3B8',marginBottom:16}}>Selected fields are replaced with ●●●●●●●● for users without approved access.</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {Object.entries(config.maskable_fields||{}).map(([field,label])=>{
            const on=(config.obfuscated_fields||[]).includes(field);
            return(
              <div key={field} onClick={()=>toggleField(field)} style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',borderRadius:10,border:`2px solid ${on?'#6366F1':'#E2E8F0'}`,background:on?'#EEF2FF':'#F8FAFC',cursor:'pointer',transition:'all .15s'}}>
                <div style={{width:20,height:20,borderRadius:6,background:on?'#6366F1':'#E2E8F0',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:12,color:'#fff',fontWeight:700}}>
                  {on?'✓':''}
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:'#1E293B'}}>{label}</div>
                  <div style={{fontSize:11,color:'#94A3B8',fontFamily:'monospace'}}>{field}</div>
                </div>
                {on&&<span style={{marginLeft:'auto',fontSize:11,color:'#6366F1',fontWeight:700}}>Masked</span>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Pending requests */}
      <div className="card" style={{padding:'20px 24px',marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>Pending Access Requests</div>
            <div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>Users requesting access to view protected field values.</div>
          </div>
          {pending.length>0&&<span style={{background:'#FEF3C7',color:'#92400E',borderRadius:99,padding:'2px 10px',fontSize:11,fontWeight:700}}>{pending.length} pending</span>}
        </div>
        {pending.length===0
          ?<div style={{fontSize:12,color:'#94A3B8',fontStyle:'italic'}}>No pending requests.</div>
          :pending.map(r=>(
            <div key={r.id} style={{border:'1px solid #FDE68A',borderRadius:10,padding:'14px 16px',marginBottom:10,background:'#FFFBEB'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                <div>
                  <span style={{fontWeight:700,color:'#1E293B',fontSize:13}}>{r.requester_email}</span>
                  <span style={{marginLeft:8,fontSize:11,color:'#92400E',background:'#FEF3C7',borderRadius:6,padding:'1px 6px'}}>{r.requester_role?.replace(/_/g,' ')}</span>
                </div>
                <span style={{fontSize:11,color:'#94A3B8'}}>{fmtTime(r.created_at)}</span>
              </div>
              <div style={{fontSize:12,color:'#475569',marginBottom:12,fontStyle:'italic'}}>"{r.reason}"</div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn-primary" style={{fontSize:12,padding:'6px 16px'}} onClick={()=>decide(r.id,'APPROVED')}>Approve (24h)</button>
                <button onClick={()=>{const reason=prompt('Reason for denial (optional):');decide(r.id,'DENIED',reason||'');}} style={{fontSize:12,padding:'6px 16px',borderRadius:8,border:'1px solid #FCA5A5',background:'#FEF2F2',color:'#DC2626',cursor:'pointer',fontWeight:600}}>Deny</button>
              </div>
            </div>
          ))
        }
      </div>

      {/* History */}
      {history.length>0&&(
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{padding:'14px 20px',fontSize:13,fontWeight:700,color:'#1E293B',borderBottom:'1px solid #F1F5F9'}}>Access Request History</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'#F8FAFC'}}>
                {['User','Status','Granted By','Expires','Reason'].map(h=>(
                  <th key={h} style={{padding:'8px 14px',textAlign:'left',fontSize:11,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.06em'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {history.map(r=>(
                <tr key={r.id} style={{borderBottom:'1px solid #F1F5F9'}}>
                  <td style={{padding:'10px 14px',fontWeight:600}}>{r.requester_email}</td>
                  <td style={{padding:'10px 14px'}}>
                    <span style={{background:statusBg[r.status]||'#F8FAFC',color:statusColor[r.status]||'#94A3B8',borderRadius:6,padding:'2px 8px',fontSize:11,fontWeight:700}}>{r.status}</span>
                  </td>
                  <td style={{padding:'10px 14px',color:'#64748B'}}>{r.granted_by||'-'}</td>
                  <td style={{padding:'10px 14px',color:'#64748B',fontSize:11}}>{r.expires_at?fmtTime(r.expires_at):'-'}</td>
                  <td style={{padding:'10px 14px',color:'#64748B',fontStyle:'italic',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.reason}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Review Configuration / Baseline Readiness ───────────────────────────────
function baselineMaturityInfo(days){
  if(days<7)  return{label:'Cold Start', color:'#DC2626',bg:'#FEF2F2',range:'0–6 days',  step:0};
  if(days<14) return{label:'Preliminary',color:'#EA580C',bg:'#FFEDD5',range:'7–13 days', step:1};
  if(days<30) return{label:'Partial',    color:'#D97706',bg:'#FEF9C3',range:'14–29 days',step:2};
  return         {label:'Stable',      color:'#16A34A',bg:'#DCFCE7',range:'30+ days', step:3};
}
const MATURITY_STEPS=['Cold Start','Preliminary','Partial','Stable'];
const MATURITY_STEP_COLORS=['#DC2626','#EA580C','#D97706','#16A34A'];
const MATURITY_STEP_DESC=[
  '0–6 days — TrustPulse uses configured policy thresholds. Baseline comparisons are not yet available.',
  '7–13 days — Early history accumulating. Threshold-based reviews are fully active.',
  '14–29 days — Initial baselines forming. Confidence improves as more activity is collected.',
  '30+ days — Stable history enables reliable baseline comparison for review scoring.',
];

  {key:'Administration',label:'Administration',       icon:'🏥',color:'#6366F1',bg:'#EEF2FF'},
  {key:'Other',         label:'Other / Support',      icon:'🔧',color:'#6B7280',bg:'#F9FAFB'},
];

    {id:'pat_af', title:'Patient Access After Login',icon:'👤',
     primary:`${policies.patient_access_after_failures_window_minutes??15} minutes`,
     secondary:'correlation window',

  const sevCards=[
    {key:'P0_CRITICAL',label:'P0 · Critical',desc:'Escalated incidents requiring immediate compliance action.',  color:'#DC2626',bg:'#FEE2E2',text:'#991B1B'},
    {key:'P1_HIGH',    label:'P1 · High',    desc:'Failed-login burst, patient access after auth failures.',    color:'#EA580C',bg:'#FFEDD5',text:'#9A3412'},
    {key:'P2_MEDIUM',  label:'P2 · Medium',  desc:'After-hours access, failed-login activity, cross-department.',color:'#D97706',bg:'#FEF9C3',text:'#854D0E'},
    {key:'P3_LOW',     label:'P3 · Low',     desc:'Weekend access, new IP address, access volume spike.',       color:'#16A34A',bg:'#DCFCE7',text:'#166534'},
  ];

  if(loading)return <div style={{padding:28,flex:1}}><Spinner/></div>;

  /* ── shared micro-components ── */
  const SectionLabel=({children,sub,action})=>(
    <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:10}}>
      <div>
        <div style={{fontSize:13,fontWeight:700,color:'#0F172A',lineHeight:1}}>{children}</div>
        {sub&&<div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{sub}</div>}
      </div>
      {action}
    </div>
  );

  const MiniBtn=({onClick,children,style={}})=>(
    <button className="btn-secondary" onClick={onClick}
      style={{fontSize:11,padding:'4px 10px',fontWeight:600,display:'flex',alignItems:'center',gap:4,...style}}>
      {children}
    </button>
  );

  return(
    <div className="fade" style={{padding:'22px 28px 32px',overflowY:'auto',flex:1,maxWidth:1200}}>

      {/* ── Page header ──────────────────────────────────────────────────── */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:3}}>Platform Status</div>
          <div style={{fontSize:16,fontWeight:700,color:'#0F172A'}}>Review Configuration</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {latestM.completed_at&&<span style={{fontSize:11,color:'#94A3B8'}}>Updated {fmtRelTime(latestM.completed_at)}</span>}
          <button className="btn-secondary" onClick={()=>load(true)} disabled={refreshing}
            style={{display:'flex',alignItems:'center',gap:5,padding:'7px 13px',fontSize:12,fontWeight:600}}>
            <span style={{display:'inline-block',animation:refreshing?'spin .6s linear infinite':'none',fontSize:13,lineHeight:1}}>↻</span>
            {refreshing?'Refreshing…':'Refresh'}
          </button>
        </div>
      </div>

      {/* ── 0. Status strip — 4 clickable overview cards ────────────────── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
        {[
          {icon:'🔌',label:'Connection',
           value:conn.connected?'Connected':'Disconnected',
           color:conn.connected?'#16A34A':'#DC2626',
           bg:conn.connected?'#F0FDF4':'#FEF2F2',
           border:conn.connected?'#BBF7D0':'#FECACA',
           sub:'OpenEMR source',pg:'system'},
          {icon:'⚡',label:'Telemetry',
           value:HEALTH_LABEL[overallStatus]||overallStatus,
           color:statusColor,bg:'#FAFBFC',border:'#E2E8F0',
           sub:'Ingestion health',pg:'ingestion'},
          {icon:'📅',label:'History',
           value:`${histDays} days`,
           color:maturity.color,bg:maturity.bg,border:maturity.color+'38',
           sub:`${maturity.label} maturity`,pg:null},
          {icon:'👥',label:'Monitored',
           value:`${config?.monitored_user_count||0} users`,
           color:'#6366F1',bg:'#EEF2FF',border:'#C7D2FE',
           sub:'Under review',pg:'employees'},
        ].map(({icon,label,value,color,bg,border,sub,pg})=>(
          <div key={label}
            onClick={pg?()=>setPage(pg):undefined}
            className="card"
            style={{padding:'14px 16px',background:bg,border:`1.5px solid ${border}`,
              cursor:pg?'pointer':'default',transition:'box-shadow .18s,transform .14s'}}
            onMouseEnter={e=>{if(pg){e.currentTarget.style.boxShadow=`0 6px 24px ${color}18`;e.currentTarget.style.transform='translateY(-2px)'}}}
            onMouseLeave={e=>{if(pg){e.currentTarget.style.boxShadow='';e.currentTarget.style.transform=''}}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:20}}>{icon}</span>
              {pg&&<span style={{fontSize:10,fontWeight:700,color,opacity:.65}}>View →</span>}
            </div>
            <div style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:3}}>{label}</div>
            <div style={{fontSize:16,fontWeight:800,color,lineHeight:1.1}}>{value}</div>
            <div style={{fontSize:10,color:'#94A3B8',marginTop:3}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* ── 1 & 2. Telemetry Health + Baseline Readiness ─────────────────── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>

        {/* Telemetry Health */}
        <div className="card" style={{padding:'18px 20px'}}>
          <SectionLabel action={<MiniBtn onClick={()=>setPage('ingestion')}>View Ingestion →</MiniBtn>}>
            Telemetry Health
          </SectionLabel>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
            {[
              {l:'Patient Access (24h)',v:fmtNum(config?.patient_access_events_24h??0),c:'#0891B2'},
              {l:'Auth Events (24h)',   v:fmtNum(config?.auth_events_24h??0),           c:'#7C3AED'},
              {l:'Total Stored',       v:fmtNum(totalRows),                            c:'#6366F1'},
              {l:'Parse Errors',       v:fmtNum(parseErrors),                          c:parseErrors>0?'#DC2626':'#16A34A'},
            ].map(({l,v,c})=>(
              <div key={l} style={{background:'#F8FAFC',borderRadius:8,padding:'9px 11px',border:'1px solid #F1F5F9'}}>
                <div style={{fontSize:9,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:3}}>{l}</div>
                <div style={{fontSize:17,fontWeight:700,color:c}}>{v}</div>
              </div>
            ))}
          </div>
          <details>
            <summary>Last run details</summary>
            <div style={{paddingTop:10,display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 20px'}}>
              {[
                {l:'Rows seen',       v:latestM.source_rows_seen??latestM.source_row_count},
                {l:'Rows normalized', v:latestM.inserted_count},
                {l:'Parser errors',   v:latestM.parse_error_count},
                {l:'Unsupported',     v:latestM.rows_unsupported_event_type},
                {l:'Excl. by policy', v:latestM.rows_excluded_by_policy},
              ].map(({l,v})=>(
                <div key={l} style={{display:'flex',justifyContent:'space-between',fontSize:11,
                  color:'#64748B',padding:'4px 0',borderBottom:'1px solid #F8FAFC'}}>
                  <span>{l}</span><span style={{fontWeight:600,color:'#334155'}}>{v??'—'}</span>
                </div>
              ))}
            </div>
          </details>
        </div>

        {/* Baseline Readiness */}
        <div className="card" style={{padding:'18px 20px'}}>
          <SectionLabel sub="Click a step for details">Baseline Readiness</SectionLabel>
          <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14}}>
            <div style={{background:maturity.bg,borderRadius:10,padding:'10px 14px',
              border:`1.5px solid ${maturity.color}30`,flexShrink:0}}>
              <div style={{fontSize:9,fontWeight:700,color:maturity.color,
                textTransform:'uppercase',letterSpacing:'.05em',marginBottom:3}}>Maturity</div>
              <div style={{fontSize:20,fontWeight:800,color:maturity.color,lineHeight:1}}>{maturity.label}</div>
              <div style={{fontSize:10,color:maturity.color,opacity:.7,marginTop:3}}>{maturity.range}</div>
            </div>
            <div style={{flex:1,paddingTop:2}}>
              <div style={{fontSize:10,color:'#94A3B8',marginBottom:4}}>History available</div>
              <div style={{fontSize:28,fontWeight:800,color:'#0F172A',lineHeight:1}}>
                {histDays}<span style={{fontSize:13,color:'#64748B',fontWeight:400,marginLeft:4}}>days</span>
              </div>
              <div style={{marginTop:8,fontSize:11,color:'#64748B'}}>
                <span style={{fontWeight:600,color:'#475569'}}>Basis:</span> Configured policy threshold
              </div>
            </div>
          </div>

          {/* Interactive step bar */}
          <div style={{display:'flex',gap:4,marginBottom:8}}>
            {MATURITY_STEPS.map((s,i)=>(
              <div key={s} style={{flex:1,cursor:'pointer'}}
                onClick={()=>setExpandedStep(expandedStep===i?null:i)}>
                <div style={{height:6,borderRadius:99,
                  background:i<=maturity.step?MATURITY_STEP_COLORS[i]:'#E2E8F0',
                  transition:'all .2s',
                  boxShadow:expandedStep===i?`0 0 0 2px ${MATURITY_STEP_COLORS[i]}44`:'none',
                  transform:expandedStep===i?'scaleY(1.6)':'scaleY(1)',transformOrigin:'bottom'}}/>
                <div style={{fontSize:9,fontWeight:700,textAlign:'center',marginTop:4,
                  color:i<=maturity.step?MATURITY_STEP_COLORS[i]:'#CBD5E1',transition:'color .2s'}}>{s}</div>
              </div>
            ))}
          </div>

          {expandedStep!==null&&(
            <div className="fade" style={{background:'#F8FAFC',borderRadius:8,padding:'9px 11px',
              border:`1px solid ${MATURITY_STEP_COLORS[expandedStep]}28`,
              fontSize:11,color:'#475569',lineHeight:1.65,marginBottom:10}}>
              {MATURITY_STEP_DESC[expandedStep]}
            </div>
          )}

          <div style={{fontSize:11,color:'#475569',lineHeight:1.65,background:'#F8FAFC',
            borderRadius:8,padding:'9px 11px',border:'1px solid #F1F5F9'}}>
            TrustPulse can run immediately using configured review policies. Baselines become more reliable as OpenEMR audit history accumulates. Thirty days is preferred for stable baseline maturity.
          </div>
        </div>
      </div>

      {/* ── 3 & 4. Validation Summary + Monitored Entities ───────────────── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>

        {/* Validation Summary */}
        <div className="card" style={{padding:'18px 20px'}}>
          <SectionLabel action={
            <MiniBtn onClick={()=>setPage('ingestion')}>View Ingestion →</MiniBtn>
          }>Validation Summary</SectionLabel>
          {[
            {l:'Total OpenEMR rows analyzed',v:fmtNum(vs.total_rows_analyzed??totalRows),bold:true},
            {l:'Invalid or unsupported rows', v:fmtNum(vs.invalid_rows??0)},
            {l:'Missing required fields',     v:fmtNum(vs.missing_required_fields??0)},
            {l:'Rows excluded by policy',     v:fmtNum(vs.excluded_by_policy??0)},
          ].map(({l,v,bold})=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
              padding:'8px 0',borderBottom:'1px solid #F8FAFC'}}>
              <span style={{fontSize:12,color:'#475569'}}>{l}</span>
              <span style={{fontSize:13,fontWeight:bold?700:600,color:'#0F172A',
                background:'#F8FAFC',padding:'1px 8px',borderRadius:6,border:'1px solid #F1F5F9'}}>{v}</span>
            </div>
          ))}
          <div style={{marginTop:12}}>
            {vs.coverage_warning
              ?<div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,
                  padding:'8px 12px',fontSize:11,color:'#92400E',display:'flex',gap:6,alignItems:'flex-start'}}>
                 <span>⚠</span>
                 <span>{vs.coverage_warning_reason||'Some rows were excluded from monitoring.'}</span>
               </div>
              :<div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:8,
                  padding:'8px 12px',fontSize:11,color:'#166534',display:'flex',gap:6,alignItems:'center'}}>
                 <span>✓</span><span>No coverage warnings detected</span>
               </div>}
          </div>
          {vs.last_validation_time&&(
            <div style={{marginTop:8,fontSize:10,color:'#94A3B8'}}>
              Last validation: {fmtRelTime(vs.last_validation_time)}
            </div>
          )}
        </div>

        {/* Monitored Entities — each row navigates to Employees */}
        <div className="card" style={{padding:'18px 20px'}}>
          <SectionLabel
            sub={`${config?.monitored_user_count||0} OpenEMR users under review`}
            action={<MiniBtn onClick={()=>setPage('employees')}>View All →</MiniBtn>}>
            Monitored Entities
          </SectionLabel>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {POLICY_ROLE_DEFS.map(({key,label,icon,color,bg})=>{
              const cnt=roleBreakdown[key]||0;
              return(
                <div key={key}
                  onClick={()=>cnt>0&&setPage('employees')}
                  style={{display:'flex',alignItems:'center',gap:10,background:cnt>0?bg:'#FAFAFA',
                    border:`1px solid ${cnt>0?color+'22':'#F1F5F9'}`,borderRadius:9,padding:'7px 11px',
                    cursor:cnt>0?'pointer':'default',transition:'all .15s',
                    opacity:cnt===0?.45:1}}
                  onMouseEnter={e=>{if(cnt>0){e.currentTarget.style.borderColor=color+'55';e.currentTarget.style.transform='translateX(3px)'}}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=cnt>0?color+'22':'#F1F5F9';e.currentTarget.style.transform=''}}>
                  <span style={{fontSize:16,flexShrink:0}}>{icon}</span>
                  <span style={{fontSize:12,fontWeight:600,color:cnt>0?color:'#94A3B8',flex:1}}>{label}</span>
                  <span style={{fontSize:15,fontWeight:800,color:cnt>0?color:'#CBD5E1',minWidth:20,textAlign:'right'}}>{cnt}</span>
                  <span style={{fontSize:10,color:'#94A3B8',minWidth:28}}>{cnt===1?'user':'users'}</span>
                  {cnt>0&&<span style={{fontSize:11,color:color,opacity:.5,flexShrink:0}}>→</span>}
                </div>
              );
            })}
          </div>
          <div style={{marginTop:10,fontSize:10,color:'#94A3B8'}}>
            System and service accounts excluded by default.
          </div>
        </div>
      </div>

      {/* ── 5. Review Policies — expandable cards ───────────────────────── */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:'#0F172A'}}>Review Policies</div>
        <span style={{fontSize:10,fontWeight:600,color:'#6366F1',background:'#EEF2FF',
          padding:'2px 8px',borderRadius:99,border:'1px solid #C7D2FE'}}>Read-only</span>
        <span style={{marginLeft:'auto',fontSize:10,color:'#94A3B8'}}>Click to expand details</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:10,marginBottom:16}}>
        {policyCards.map(({id,title,icon,primary,secondary,detail,hipaa,color,caseType})=>{
          const open=expandedPolicy===id;
          return(
            <div key={id} onClick={()=>setExpandedPolicy(open?null:id)}
              className="card"
              style={{padding:'13px 15px',borderLeft:`3px solid ${color}`,cursor:'pointer',
                background:open?`linear-gradient(135deg,${color}06,#fff)`:'#fff',
                boxShadow:open?`0 4px 18px ${color}18,0 1px 4px rgba(0,0,0,.05)`:'',transition:'all .18s'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:7,marginBottom:9}}>
                <span style={{fontSize:15,lineHeight:'18px'}}>{icon}</span>
                <span style={{fontSize:11,fontWeight:700,color:'#475569',lineHeight:1.3,flex:1}}>{title}</span>
                <span style={{fontSize:14,color:color,lineHeight:1,transition:'transform .2s',
                  display:'inline-block',transform:open?'rotate(180deg)':'none',marginTop:2}}>⌄</span>
              </div>
              <div style={{fontSize:18,fontWeight:800,color,lineHeight:1,marginBottom:1}}>{primary}</div>
              <div style={{fontSize:11,color:'#94A3B8'}}>{secondary}</div>
              {open&&(
                <div className="fade">
                  <div style={{height:1,background:`${color}20`,margin:'10px 0'}}/>
                  <div style={{fontSize:11,color:'#475569',lineHeight:1.6,marginBottom:8}}>{detail}</div>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6,flexWrap:'wrap'}}>
                    <span style={{fontSize:10,fontWeight:700,color:color,
                      background:`${color}12`,padding:'3px 8px',borderRadius:5,
                      border:`1px solid ${color}22`}}>{hipaa}</span>
                    {caseType&&(
                      <button className="btn-secondary"
                        onClick={e=>{e.stopPropagation();setPage('cases');}}
                        style={{fontSize:10,padding:'3px 9px',fontWeight:600}}>View Cases →</button>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ── 6. Severity — click to view cases ───────────────────────────── */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:'#0F172A'}}>Risk & Severity</div>
        <span style={{marginLeft:'auto',fontSize:10,color:'#94A3B8'}}>Click to view matching cases</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:20}}>
        {sevCards.map(({key,label,desc,color,bg,text})=>(
          <div key={key} className="card"
            onClick={()=>setPage('cases')}
            style={{padding:'13px 15px',borderTop:`3px solid ${color}`,cursor:'pointer',transition:'all .18s'}}
            onMouseEnter={e=>{e.currentTarget.style.boxShadow=`0 6px 24px ${color}22`;e.currentTarget.style.transform='translateY(-2px)'}}
            onMouseLeave={e=>{e.currentTarget.style.boxShadow='';e.currentTarget.style.transform=''}}>
            <span className="badge" style={{background:bg,color:text,
              display:'inline-flex',alignItems:'center',gap:4,marginBottom:8}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:color,flexShrink:0}}/>
              {label}
            </span>
            <div style={{fontSize:11,color:'#64748B',lineHeight:1.6,marginBottom:8}}>{desc}</div>
            <div style={{fontSize:10,fontWeight:700,color:color,opacity:.7}}>View cases →</div>
          </div>
        ))}
      </div>

      {/* ── Governance notice ────────────────────────────────────────────── */}
      <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:10,
        padding:'11px 15px',display:'flex',gap:10,alignItems:'flex-start'}}>
        <span style={{fontSize:14,flexShrink:0,lineHeight:'18px'}}>⚖️</span>
        <div style={{fontSize:11,color:'#78350F',lineHeight:1.65}}>
          <span style={{fontWeight:700}}>Governance notice — </span>
          TrustPulse uses configured review policies and OpenEMR audit history to surface events requiring human review. All cases require disposition by a qualified compliance officer. This tool does not make breach-notification determinations or provide legal advice.
        </div>
      </div>

    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(getSavedUser);
  const initialRoute=parseHashRoute(typeof window!=='undefined'?window.location.hash:'');
  const [page,setPage]=useState(initialRoute.page);
  const [cases,setCases]=useState([]);
  const [users,setUsers]=useState([]);
  const [ingestion,setIngestion]=useState(null);
  const [system,setSystem]=useState(null);
  const [loadingData,setLoadingData]=useState(false);
  const [drawerCase,setDrawerCase]=useState(initialRoute.caseId);
  const pollRef=useRef(null);

  function onLogin(token,u){
    setToken(token);saveUser(u);setUser(u);
    const route=parseHashRoute(window.location.hash);
    if(route.redirect||!window.location.hash) applyHashRoute(route.page,route.caseId);
  }
  function onLogout(){setToken(null);saveUser(null);setUser(null)}

  const fetchAll=useCallback(async()=>{
    setLoadingData(true);
    try{
      const [c,i,s,u]=await Promise.all([
        apiFetch('/api/cases'),
        apiFetch('/api/ingestion/status'),
        apiFetch('/api/system/status'),
        apiFetch('/api/users'),
      ]);
      if(c)setCases(c.cases||[]);
      if(i)setIngestion(i);
      if(s)setSystem(s);
      if(u)setUsers(Array.isArray(u)?u:[]);
    }catch{}
    setLoadingData(false);
  },[]);

  useEffect(()=>{
    if(!user)return;
    fetchAll();
    pollRef.current=setInterval(()=>fetchAll(),60000);
    return()=>clearInterval(pollRef.current);
  },[user]);

  useEffect(()=>{
    function syncRoute(){
      if(!window.location.hash){
        window.location.replace(buildHashRoute('dashboard'));
        return;
      }
      const route=parseHashRoute(window.location.hash);
      if(route.redirect){
        window.location.replace(buildHashRoute('dashboard'));
        return;
      }
      setPage(route.page);
      setDrawerCase(route.page==='cases'?route.caseId:null);
    }
    syncRoute();
    window.addEventListener('hashchange',syncRoute);
    return()=>window.removeEventListener('hashchange',syncRoute);
  },[]);

  const navigateToPage=useCallback((nextPage)=>{
    applyHashRoute(nextPage);
    if(nextPage!=='cases') setDrawerCase(null);
  },[]);
  const openCaseRoute=useCallback((caseId)=>{
    applyHashRoute('cases',caseId);
  },[]);
  const closeCaseRoute=useCallback(()=>{
    applyHashRoute('cases');
  },[]);

  if(!user)return <LoginPage onLogin={onLogin}/>;

  const connected=system?.openemr_connection?.connected||false;
  const pageTitles={
    dashboard:         {title:'Dashboard',subtitle:'Overview of review workload, telemetry health, and cases requiring attention.'},
    cases:             {title:'Cases',subtitle:'Review OpenEMR-derived patient-access and authentication cases.'},
    employees:         {title:'Employees',subtitle:'View OpenEMR users and role context used for review.'},
    ingestion:         {title:'Ingestion',subtitle:'Monitor OpenEMR audit ingestion and telemetry health.'},
    reports:           {title:'Reports',subtitle:'Generate and review evidence packages.'},
    system:            {title:'Connection',subtitle:'Check OpenEMR connector status and source availability.'},
    review_config:     {title:'Review Config',subtitle:'Baseline readiness, telemetry health, monitored entities, and review policies.'},
    admin_users:       {title:'Users',subtitle:'Manage TrustPulse users.'},
    admin_permissions: {title:'Permission Groups',subtitle:'Review role-based access permissions.'},
    admin_privacy:     {title:'Data Privacy',subtitle:'Review privacy controls and patient identifier handling.'},
    admin_settings:    {title:'Settings',subtitle:'Configure local demo/product settings.'},
  };

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar page={page} onNavigate={navigateToPage} user={user} onLogout={onLogout} casesCount={cases.filter(isActiveCase).length}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <Header title={pageTitles[page]?.title||''} subtitle={pageTitles[page]?.subtitle||''} connected={connected}/>
        {loadingData&&cases.length===0&&<Spinner/>}
        {page==='dashboard'&&<DashboardPage cases={cases} ingestion={ingestion} system={system} setPage={navigateToPage}/>}
        {page==='cases'&&<CasesPage cases={cases} user={user} onCaseClick={id=>openCaseRoute(id)}/>}
        {page==='employees'&&<EmployeesPage cases={cases} users={users}/>}
        {page==='ingestion'&&<IngestionPage ingestion={ingestion} onRefresh={fetchAll}/>}
        {page==='reports'&&<ReportsPage/>}
        {page==='system'&&<SystemPage system={system}/>}
        {page==='admin_users'&&<AdminUsersPage/>}
        {page==='admin_permissions'&&<AdminPermissionsPage/>}
        {page==='admin_privacy'&&<AdminPrivacyPage/>}
        {page==='admin_settings'&&<AdminSettingsPage/>}
        {page==='review_config'&&<ReviewConfigPage ingestion={ingestion} system={system} setPage={navigateToPage}/>}
      </div>
      {drawerCase&&(
        <CaseDrawer
          caseId={drawerCase}
          user={user}
          onClose={closeCaseRoute}
          onDisposed={()=>fetchAll()}
          onRefreshCases={fetchAll}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));
</script>
</body>
</html>
