                                  {s.time_window_start&&<span style={{fontSize:10,color:'#6366F1',fontFamily:'monospace'}}>{s.time_window_start.replace('T',' ').slice(0,16)}</span>}
                                  {s.explanation&&<span style={{fontSize:11,color:'#475569',flex:1}}>{s.explanation}</span>}
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                  {c.source_traceability&&(()=>{
                    const rawSrcNames=(c.source_traceability.source_names||[]).flatMap(n=>n.split('+')).map(n=>n.trim()).filter(Boolean);
                    const cleanSrc=n=>{
                      const l=n.toLowerCase().replace(/_log/g,'').replace(/_/g,' ').trim();
                      if(l==='openemr'||l==='openemr ')return'OpenEMR';
                      if(l==='api'||l==='api ')return'API';
                      return l.replace(/\b\w/g,ch=>ch.toUpperCase());
                    };
                    const srcChips=[...new Set(rawSrcNames.map(cleanSrc))];
                    const connectors=c.source_traceability.connector_names||[];
                    const manifestIds=c.source_traceability.manifest_ids||[];
                    const manifestHashes=c.source_traceability.manifest_hashes||[];
                    return(
                      <div style={{border:'1px solid #E2E8F0',borderRadius:14,background:'#fff',overflow:'hidden'}}>
                        {/* Header */}
                        <div style={{padding:'11px 16px',borderBottom:'1px solid #F1F5F9',background:'#F8FAFC',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                          <div style={{display:'flex',alignItems:'center',gap:8}}>
                            <span style={{fontSize:13}}>🔗</span>
                            <span style={{fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.08em'}}>Source Traceability</span>
                          </div>
                          {c.demo_source_label&&(
                            <span style={{fontSize:10,fontWeight:700,color:'#3730A3',background:'#EEF2FF',border:'1px solid #C7D2FE',borderRadius:99,padding:'2px 9px'}}>{c.demo_source_label}</span>
                          )}
                        </div>

                        <div style={{padding:'14px 16px'}}>
                          {/* Provenance chain: Source → Connector */}
                          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}}>
                            {srcChips.map(s=>(
                              <span key={s} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:8,background:'#F0F9FF',border:'1px solid #BAE6FD',fontSize:12,fontWeight:700,color:'#0369A1'}}>
                                <svg width="11" height="11" viewBox="0 0 20 20" fill="currentColor" style={{opacity:.7}}><path d="M4 4h4v4H4zm8 0h4v4h-4zM4 12h4v4H4zm8 0h4v4h-4z"/></svg>
                                {s}
                              </span>
                            ))}
                            {connectors.length>0&&(
                              <>
                                <span style={{fontSize:14,color:'#CBD5E1',fontWeight:300,lineHeight:1}}>→</span>
                                {connectors.map(cn=>(
                                  <span key={cn} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:8,background:'#F5F3FF',border:'1px solid #DDD6FE',fontSize:12,fontWeight:700,color:'#6D28D9'}}>
                                    <svg width="11" height="11" viewBox="0 0 20 20" fill="currentColor" style={{opacity:.7}}><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4zm0 2a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4z"/></svg>
                                    {cn}
                                  </span>
                                ))}
                              </>
                            )}
                          </div>

                          {/* Manifests */}
                          {(manifestIds.length>0||manifestHashes.length>0)&&(
                            <div style={{background:'#F8FAFC',borderRadius:10,border:'1px solid #E8EDF4',overflow:'hidden',marginBottom:12}}>
                              <div style={{padding:'8px 12px',borderBottom:'1px solid #E8EDF4',display:'flex',alignItems:'center',gap:6}}>
                                <span style={{fontSize:10,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.07em'}}>Ingestion Manifests</span>
                                {manifestIds.length>0&&<span style={{fontSize:10,fontWeight:700,color:'#6366F1',background:'#EEF2FF',padding:'1px 6px',borderRadius:99,border:'1px solid #C7D2FE'}}>{manifestIds.length}</span>}
                              </div>
                              {manifestIds.length>0&&(
                                <div style={{padding:'8px 12px',display:'flex',flexWrap:'wrap',gap:5,borderBottom:manifestHashes.length>0?'1px solid #E8EDF4':'none'}}>
                                  {manifestIds.map(mid=>(
                                    <span key={mid} style={{fontFamily:'monospace',fontSize:11,fontWeight:600,color:'#334155',background:'#fff',border:'1px solid #E2E8F0',borderRadius:5,padding:'3px 8px'}}>{mid}</span>
                                  ))}
                                </div>
                              )}
                              {manifestHashes.length>0&&(
                                <div style={{padding:'8px 12px'}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:5}}>Chain Hash</div>
                                  <div style={{fontFamily:'monospace',fontSize:11,color:'#475569',background:'#fff',border:'1px solid #E2E8F0',borderRadius:6,padding:'6px 10px',wordBreak:'break-all',lineHeight:1.6}}>
                                    {manifestHashes.join('\n')}
                                  </div>
                                </div>
                              )}
                            </div>
                          )}

                          <div style={{fontSize:11,color:'#94A3B8',lineHeight:1.6}}>Events retain source log ID, OpenEMR username, event time, type, and manifest provenance for audit continuity.</div>
                        </div>
                      </div>
                    );
                  })()}
                  {c.fired_rules?.length>0&&(
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Rules Fired</div>
                      <div style={{display:'flex',flexDirection:'column',gap:6}}>
                        {c.fired_rules.map(r=>{
                          const fired=r.fired&&!r.not_evaluated;
                          const notEval=r.not_evaluated;
                          const ac=notEval?'#6366F1':fired?'#DC2626':'#16A34A';
                          const bg=notEval?'#F5F3FF':fired?'#FFF5F5':'#F0FDF4';
                          const bdr=notEval?'#DDD6FE':fired?'#FECACA':'#BBF7D0';
                          return(
                            <div key={r.rule_id} style={{borderRadius:10,border:`1px solid ${bdr}`,background:bg,display:'flex',overflow:'hidden'}}>
                              <div style={{width:3,background:ac,flexShrink:0}}/>
                              <div style={{padding:'11px 14px',flex:1,minWidth:0}}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:5,flexWrap:'wrap'}}>
                                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                                    <span style={{fontSize:11,fontWeight:800,color:ac,fontFamily:'monospace'}}>{r.rule_id}</span>
                                    <span style={{fontSize:12,fontWeight:600,color:'#1E293B'}}>{r.rule_name}</span>
                                  </div>
                                  <div style={{display:'flex',gap:5,flexShrink:0}}>
                                    {notEval&&<span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:99,background:'#EEF2FF',color:'#4338CA',border:'1px solid #C7D2FE'}}>Not Evaluated</span>}
                                    {fired&&<span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:99,background:'#FEE2E2',color:'#991B1B',border:'1px solid #FECACA'}}>⚡ Fired</span>}
                                    {!fired&&!notEval&&<span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:99,background:'#DCFCE7',color:'#166534',border:'1px solid #86EFAC'}}>✓ Clear</span>}
                                    {r.confidence&&<span style={{fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:99,background:'#F1F5F9',color:'#475569',border:'1px solid #E2E8F0'}}>{r.confidence}</span>}
                                  </div>
                                </div>
                                <div style={{fontSize:12,color:'#475569',lineHeight:1.5}}>{r.description}</div>
                                {r.not_evaluated_reason&&<div style={{fontSize:11,color:'#6366F1',marginTop:5}}>ℹ {r.not_evaluated_reason}</div>}
                                {r.limitations?.length>0&&<div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>Limitations: {r.limitations.join(' · ')}</div>}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                  <div style={{background:'#F8FAFC',borderRadius:10,padding:'10px 14px',border:'1px solid #E8EDF4',fontFamily:'monospace',fontSize:11,color:'#64748B',lineHeight:1.9}}>
                    <div><span style={{color:'#CBD5E1'}}>case_id: </span><span style={{color:'#334155',fontWeight:600}}>{c.case_id}</span></div>
                    {c.breach_deadline&&<div><span style={{color:'#CBD5E1'}}>breach_deadline: </span><span style={{color:'#DC2626',fontWeight:600}}>{fmtDate(c.breach_deadline)}</span><span style={{color:'#94A3B8'}}> · {c.breach_days_remaining}d remaining</span></div>}
                  </div>
                </div>
              )}

            </div>
          )}
        </div>
      </div>

      {/* ── QUICK REVIEW GUIDE MODAL ── */}
      {c?.patient_access_assessment&&showChecklistModal&&(()=>{
        const paa=c.patient_access_assessment;
        const pri=paa.primary_suggested_action;
        const missingPlain=buildMissingInfoSummary(paa);
        const subtitle=reviewGuideSubtitle(c,paa);
        const summary=reviewGuideSummary(c,paa);
        const checks=reviewGuideChecks(c,paa);
        const theme=reviewGuideTheme(c,paa);
        const signalChips=reviewGuideSignalChips(c,paa);
        const metricChips=reviewGuideMetricChips(c,paa);
        const actionDescription=reviewGuideActionDescription(c,paa,pri);
        const messagePreview=pri?.question_text||pri?.suggested_note||'';
        return(
        <>
          <div className="overlay" style={{zIndex:70}} onClick={()=>setShowChecklistModal(false)}/>
          <div className="review-guide-modal" style={{'--guide-accent':theme.accent,'--guide-accent-soft':theme.accentSoft,'--guide-border':theme.border,'--guide-surface':theme.surface}}>
            <div className="review-guide-hero" style={{background:theme.hero}}>
              <div className="review-guide-hero-label">Quick Review Guide</div>
              <div className="review-guide-hero-title">{subtitle}</div>
              <div className="review-guide-hero-subtitle">{reviewGuideUserLine(c,paa)}</div>
              <div className="review-guide-chip-row">
                {signalChips.map(chip=><span key={chip} className="review-guide-chip">{chip}</span>)}
              </div>
            </div>

            <div className="review-guide-layout">
              <div className="review-guide-stack">
                <div className="review-guide-card review-signal-card fade">
                  <div className="review-guide-card-title">Case summary</div>
                  <div className="review-signal-text">{summary}</div>
                  <div className="review-signal-metrics">
                    {metricChips.map(chip=><span key={chip} className="review-signal-metric">{chip}</span>)}
                  </div>
                </div>

                {checks.length>0&&(
                  <div className="review-guide-card review-verify-card fade">
                    <div className="review-guide-card-title">Things to confirm</div>
                    <div style={{display:'flex',flexDirection:'column',gap:8}}>
                      {checks.slice(0,3).map((item,idx)=>(
                          <div key={`chk-${idx}`} className="review-check-row">
                            <div className="review-check-bullet"/>
                            <div className="review-check-text">{item}</div>
                          </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              <div className="review-guide-stack">
                {pri&&(
                  <div className="review-guide-card review-action-panel fade">
                    <div className="review-guide-card-title">Recommended action</div>
                    <div className="review-action-badge">{reviewGuideActionLabel(pri.action)}</div>
                    <div className="review-action-name">{reviewGuideActionLabel(pri.action)}</div>
                    <div className="review-action-desc">{actionDescription}</div>
                    {messagePreview&&(
                      <div>
                        <div className="review-message-label">Suggested message</div>
                        <div className="review-message-preview">
                          <div className="review-message-preview-text">“{messagePreview}”</div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {missingPlain&&(
                  <div className="review-guide-card review-context-card fade">
                    <div className="review-guide-card-title">Missing context</div>
                    <div className="review-context-copy">{missingPlain}</div>
                  </div>
                )}
              </div>
            </div>

            <div className="review-guide-footer">
              <div className={`review-applied-state${preparedGuideAction||copiedGuideMessage?' visible':''}`}>
                {preparedGuideAction?'Action prepared in the review form.':copiedGuideMessage?'Message copied.':''}
              </div>
              <div className="review-guide-footer-actions">
                {pri&&<button className="btn-primary" style={{fontSize:12,padding:'10px 18px',background:theme.accent}} onClick={()=>applySuggestedAction(pri)}>Use recommended action</button>}
                {messagePreview&&<button className="btn-secondary" style={{fontSize:12,padding:'10px 14px'}} onClick={()=>copySuggestedNote(messagePreview)}>{copiedGuideMessage?'Copied':'Copy message'}</button>}
                <button className="btn-outline" style={{fontSize:12,padding:'10px 14px'}} onClick={()=>setShowChecklistModal(false)}>Close</button>
              </div>
            </div>
          </div>
        </>
        );
      })()}
    </>
  );
}

// ─── Dashboard Page ───────────────────────────────────────────────────────────
function DashboardPage({cases,ingestion,system,setPage}){
  const total=cases.length;
  const openCases=useMemo(()=>cases.filter(isActiveCase),[cases]);
  const critical=useMemo(()=>openCases.filter(c=>c.severity==='P0_CRITICAL'),[openCases]);
  const breach=useMemo(()=>openCases.filter(c=>c.breach_risk),[openCases]);
  const users=useMemo(()=>new Set(openCases.map(c=>c.user_id)).size,[openCases]);
  const eventsStored=ingestion?.total_events_stored||0;
  const needsCtx=useMemo(()=>openCases.filter(c=>c.status==='NEEDS_CONTEXT'),[openCases]);
  const escalatedCases=useMemo(()=>openCases.filter(c=>c.status==='ESCALATED'),[openCases]);

  // Severity breakdown
  const sevCounts=useMemo(()=>{
    const m={P0_CRITICAL:0,P1_HIGH:0,P2_MEDIUM:0,P3_LOW:0};
    openCases.forEach(c=>m[c.severity]=(m[c.severity]||0)+1);
    return m;
  },[openCases]);

  // Pattern breakdown
  const patternCounts=useMemo(()=>{
    const m={};openCases.forEach(c=>{m[c.pattern_type]=(m[c.pattern_type]||0)+1});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  },[openCases]);

  // Top users by max risk
  const userRisk=useMemo(()=>{
    const m={};
    openCases.forEach(c=>{if(!m[c.user_name]||c.risk_score>m[c.user_name])m[c.user_name]=c.risk_score});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
  },[openCases]);

  // Triage bucket
  const triageCounts=useMemo(()=>{
    const m={TODAY:0,THIS_WEEK:0,BACKLOG:0};
    openCases.forEach(c=>{m[c.triage_bucket]=(m[c.triage_bucket]||0)+1});
    return m;
  },[openCases]);

  // Role breakdown
  const roleCounts=useMemo(()=>{
    const m={};
    openCases.forEach(c=>{const r=inferRole(c.user_id);m[r]=(m[r]||0)+1});
    return m;
  },[openCases]);

  // Cases by role + severity (grouped bar)
  const roles=Object.keys(ROLE_COLOR);
  const severities=['P0_CRITICAL','P1_HIGH','P2_MEDIUM','P3_LOW'];
  const roleSevData=useMemo(()=>{
    const m={};
    severities.forEach(s=>{ m[s]={};roles.forEach(r=>{m[s][r]=0}) });
    openCases.forEach(c=>{
      const r=inferRole(c.user_id);
      if(m[c.severity])m[c.severity][r]=(m[c.severity][r]||0)+1;
    });
    return m;
  },[openCases]);

  // Ingestion timeline
  const manifests=useMemo(()=>
    [...(ingestion?.manifests||[])].reverse().slice(-12)
  ,[ingestion]);

  const connected=system?.openemr_connection?.connected||false;

  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      {/* KPI Row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:14,marginBottom:24}}>
        <KpiCard icon="🗂" label="Active Cases" value={fmtNum(openCases.length)} numVal={openCases.length} color="#2563EB"
          onClick={()=>setPage('cases')}/>
        <KpiCard icon="🔴" label="P0 Critical" value={fmtNum(critical.length)} numVal={critical.length} color="#DC2626"
          pulse={critical.length>0}
          onClick={()=>setPage('cases')}/>
        <KpiCard icon="⏳" label="Needs Context" value={fmtNum(needsCtx.length)} numVal={needsCtx.length} color="#D97706"
          onClick={()=>{try{localStorage.setItem('tp_cases_status','NEEDS_CONTEXT')}catch{}setPage('cases');}}/>
        <KpiCard icon="🔺" label="Escalated" value={fmtNum(escalatedCases.length)} numVal={escalatedCases.length} color="#EA580C"
          onClick={()=>{try{localStorage.setItem('tp_cases_status','ESCALATED')}catch{}setPage('cases');}}/>
        <KpiCard icon="⚠️" label="Breach Risk" value={fmtNum(breach.length)} numVal={breach.length} color="#991B1B"
          onClick={()=>setPage('cases')}/>
        <KpiCard icon="📋" label="Events Ingested" value={fmtNum(eventsStored)} numVal={eventsStored} color="#6366F1"
          onClick={()=>setPage('ingestion')}/>
      </div>

      {/* Row 2: Severity + Pattern */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1.6fr',gap:16,marginBottom:16}}>
        <ChartCard title="Cases by Severity" subtitle="Active cases breakdown" onClick={()=>setPage('cases')}>
          {openCases.length>0
            ?<DonutChart
               labels={['P0 Critical','P1 High','P2 Medium','P3 Low']}
               data={[sevCounts.P0_CRITICAL,sevCounts.P1_HIGH,sevCounts.P2_MEDIUM,sevCounts.P3_LOW]}
               colors={['#DC2626','#EA580C','#D97706','#16A34A']}
               centerText={{value:openCases.length,label:'Active Cases'}}/>
            :<EmptyChart message="No active cases"/>}
        </ChartCard>
        <ChartCard title="Cases by Pattern Type" subtitle="Distribution of detected risk patterns" onClick={()=>setPage('cases')}>
          {patternCounts.length>0
            ?<VBarChart
               labels={patternCounts.map(([p])=>pLabel(p))}
               values={patternCounts.map(([,v])=>v)}
               colors={patternCounts.map(([p])=>PATTERN_COLOR[p]||'#6B7280')}/>
            :<EmptyChart message="No pattern data"/>}
        </ChartCard>
      </div>

      {/* Row 3: User Risk + Triage */}
      <div style={{display:'grid',gridTemplateColumns:'1.6fr 1fr',gap:16,marginBottom:16}}>
        <ChartCard title="Top Users by Max Risk Score" subtitle="Highest risk scores per employee" onClick={()=>setPage('employees')}>
          {userRisk.length>0
            ?<HBarChart
               labels={userRisk.map(([name])=>name)}
               values={userRisk.map(([,score])=>score)}
               colors={userRisk.map(([,score])=>score>=80?'#DC2626':score>=50?'#EA580C':score>=30?'#D97706':'#16A34A')}
               unit="pts"/>
            :<EmptyChart message="No user risk data"/>}
        </ChartCard>
        <ChartCard title="Cases by Triage Bucket" subtitle="Urgency classification" onClick={()=>setPage('cases')}>
          {openCases.length>0
            ?<VBarChart
               labels={['Today','This Week','Backlog']}
               values={[triageCounts.TODAY,triageCounts.THIS_WEEK,triageCounts.BACKLOG]}
               colors={['#DC2626','#EA580C','#6366F1']}/>
            :<EmptyChart/>}
        </ChartCard>
      </div>

      {/* Row 4: Role×Severity grouped bar + Ingestion timeline */}
      <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:16,marginBottom:16}}>
        <ChartCard title="Cases by Role Group &amp; Severity" subtitle="Grouped breakdown by department" onClick={()=>setPage('cases')}>
          {openCases.length>0
            ?<GroupedBarChart
               labels={roles.filter(r=>roleCounts[r]>0)}
               datasets={severities.map(s=>({
                 label:SEV[s].label,
                 data:roles.filter(r=>roleCounts[r]>0).map(r=>roleSevData[s][r]||0),
                 backgroundColor:SEV[s].color,
               }))}/>
            :<EmptyChart/>}
        </ChartCard>
        <ChartCard title="Role Distribution" subtitle="Cases by department" onClick={()=>setPage('employees')}>
          {openCases.length>0
            ?<DonutChart
               labels={Object.keys(roleCounts)}
               data={Object.values(roleCounts)}
               colors={Object.keys(roleCounts).map(r=>ROLE_COLOR[r]||'#6B7280')}
               centerText={{value:Object.keys(roleCounts).length,label:'Departments'}}/>
            :<EmptyChart/>}
        </ChartCard>
      </div>

      {/* Row 5: Ingestion timeline */}
      <ChartCard title="Ingestion Timeline" subtitle="Events processed per ingestion run" onClick={()=>setPage('ingestion')}>
        {manifests.length>0
          ?<LineChart
             labels={manifests.map(m=>fmtTime(m.started_at))}
             datasets={[{
               label:'Events Ingested',
               data:manifests.map(m=>m.inserted_count||0),
               borderColor:'#6366F1',
               backgroundColor:'rgba(99,102,241,.1)',
               fill:true,
             },{
               label:'Source Rows',
               data:manifests.map(m=>m.source_row_count||0),
               borderColor:'#0891B2',
               backgroundColor:'transparent',
             }]}/>
          :<EmptyChart message="No ingestion runs yet"/>}
      </ChartCard>
    </div>
  );
}

// ─── Case Card (rich row) ─────────────────────────────────────────────────────
const ACTION_ICON={
  REVIEW_STARTED:{icon:'▶',color:'#6366F1'},
  ESCALATED:{icon:'⬆',color:'#EA580C'},
  REQUEST_CONTEXT:{icon:'?',color:'#2563EB'},
  RESOLVED_AUTHORIZED_ACCESS:{icon:'✓',color:'#16A34A'},
  RESOLVED_NO_ISSUE:{icon:'✓',color:'#16A34A'},
  FALSE_POSITIVE:{icon:'✗',color:'#6B7280'},
  COMMENT_ADDED:{icon:'💬',color:'#64748B'},
  REOPENED:{icon:'↺',color:'#D97706'},
  SUPPRESSED:{icon:'–',color:'#7C3AED'},
  EVIDENCE_EXPORTED:{icon:'⬇',color:'#0891B2'},
};

function CaseCard({c,onClick}){
  const sev=SEV[c.severity]||SEV.P3_LOW;
  const isAuth=isAuthCase(c);
  const hasPatients=!isAuth&&Number(c.unique_patient_token_count||0)>0;
  const statusStyles={
    NEEDS_CONTEXT:{bg:'#FEF3C7',text:'#B45309'},
    ESCALATED:{bg:'#FFEDD5',text:'#C2410C'},
    OPEN:{bg:'#DBEAFE',text:'#1D4ED8'},
    UNDER_REVIEW:{bg:'#EDE9FE',text:'#6D28D9'},
    REOPENED:{bg:'#E0E7FF',text:'#4338CA'},
  }[c.status]||{bg:'#F1F5F9',text:'#475569'};

  return(
    <div className="case-card" onClick={onClick}
      style={{borderLeft:`4px solid ${sev.color}`,display:'flex',alignItems:'stretch',overflow:'hidden'}}>
      {/* Left body */}
      <div style={{flex:1,padding:'14px 16px 13px',minWidth:0}}>
        {/* Top row: badges + time */}

        </div>
        {/* Title */}
        <div style={{fontSize:14,fontWeight:700,color:'#0F172A',lineHeight:1.4,marginBottom:8,
          overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>
          {c.title}
        </div>
        {/* Meta row */}
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>

          <span style={{fontSize:10,color:'#CBD5E1'}}>·</span>
          <RoleBadge role={inferRole(c.user_id)}/>
          <span style={{fontSize:10,color:'#CBD5E1'}}>·</span>
          <PatternBadge pattern={c.pattern_type}/>
          <span style={{fontSize:10,color:'#CBD5E1'}}>·</span>
          <span style={{fontSize:11,color:'#64748B',display:'flex',alignItems:'center',gap:3}}>
            <span style={{fontSize:13}}>⚡</span>{fmtNum(c.event_count)} events
          </span>
          {hasPatients&&<>
            <span style={{fontSize:10,color:'#CBD5E1'}}>·</span>
            <span style={{fontSize:11,color:'#64748B'}}>👤 {fmtNum(c.unique_patient_token_count)} patients</span>
          </>}
        </div>
      </div>
      {/* Right: risk ring + arrow */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,padding:'14px 16px',borderLeft:'1px solid #F1F5F9',minWidth:72,flexShrink:0}}>
        <RiskRing score={c.risk_score||0} size={52}/>
        <span style={{fontSize:10,color:'#94A3B8',fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase'}}>Risk</span>
        <span style={{fontSize:16,color:'#CBD5E1'}}>›</span>
      </div>
    </div>
  );
}

// ─── Cases Page ───────────────────────────────────────────────────────────────
function CasesPage({cases,user,onCaseClick}){
  const [search,setSearch]=useState('');
  const [sevFilter,setSevFilter]=useState('');
  const [patFilter,setPatFilter]=useState('');
  const [caseTypeFilter,setCaseTypeFilter]=useState('');
  const [statusFilter,setStatusFilter]=useState(()=>{
    try{const s=localStorage.getItem('tp_cases_status');if(s){localStorage.removeItem('tp_cases_status');return s;}}catch{}
    return 'ACTIVE';
  });
  const [groupBy,setGroupBy]=useState('none');
  const [sortBy,setSortBy]=useState('latest_event_time');
  const [sortDir,setSortDir]=useState('desc');

  const filtered=useMemo(()=>{
    let c=[...cases];
    if(search)c=c.filter(x=>(x.user_name||'').toLowerCase().includes(search.toLowerCase())||(x.title||'').toLowerCase().includes(search.toLowerCase()));
    if(sevFilter)c=c.filter(x=>x.severity===sevFilter);
    if(patFilter)c=c.filter(x=>x.pattern_type===patFilter);
    if(caseTypeFilter)c=c.filter(x=>(x.case_type||'').toUpperCase()===caseTypeFilter);
    if(statusFilter==='ACTIVE')c=c.filter(isActiveCase);
    else if(statusFilter)c=c.filter(x=>x.status===statusFilter);
    c.sort((a,b)=>{
      let av=a[sortBy],bv=b[sortBy];
      if(sortBy==='latest_event_time'||sortBy==='created_at'){
        av=av?new Date(av).getTime():0;
        bv=bv?new Date(bv).getTime():0;
      }else if(typeof av==='string'){
        av=av.toLowerCase();
        bv=(bv||'').toLowerCase();
      }
      if(av===bv)return 0;
      return sortDir==='asc' ? (av>bv?1:-1) : (av<bv?1:-1);
    });
    return c;
  },[cases,search,sevFilter,patFilter,caseTypeFilter,statusFilter,sortBy,sortDir]);

  const grouped=useMemo(()=>{
    if(groupBy==='none')return[{key:'All Cases',items:filtered}];
    const m={};
    const order=[];
    filtered.forEach(c=>{
      const k=groupBy==='role'?inferRole(c.user_id):groupBy==='severity'?c.severity:groupBy==='pattern'?c.pattern_type:c.user_name;
      if(!m[k]){m[k]=[];order.push(k);}
      m[k].push(c);
    });
    return order.map(key=>({key,items:m[key]}));
  },[filtered,groupBy]);

  function toggleSort(col){
    if(sortBy===col)setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortBy(col);setSortDir('desc');}
  }
  function SortIcon({col}){return<span style={{color:sortBy===col?'#6366F1':'#CBD5E1',marginLeft:4,fontSize:10}}>{sortDir==='asc'&&sortBy===col?'▲':'▼'}</span>}

  const patterns=[...new Set(cases.map(c=>c.pattern_type))];

  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      {/* ── FILTER PANEL ── */}
      <div style={{background:'#fff',borderRadius:16,border:'1px solid #E8EDF4',boxShadow:'0 2px 16px rgba(15,23,42,.07)',marginBottom:16,overflow:'hidden'}}>

        {/* Row 1 — Search · Pattern · Group · Active-filter badge */}
        <div style={{padding:'13px 18px 11px',borderBottom:'1px solid #F1F5F9',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>

          {/* Search */}
          <div style={{position:'relative',flex:'1 1 180px',minWidth:160}}>
            <svg style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:'#94A3B8'}} width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 3.5 3.5"/>
            </svg>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search cases, users, titles…"
              style={{width:'100%',paddingLeft:34,paddingRight:search?34:12,height:38,fontSize:13,background:'#F8FAFC',border:'1.5px solid #E2E8F0',borderRadius:10,outline:'none',transition:'border-color .15s,box-shadow .15s,background .15s',boxSizing:'border-box'}}
              onFocus={e=>{e.target.style.borderColor='#6366F1';e.target.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)';e.target.style.background='#fff'}}
              onBlur={e=>{e.target.style.borderColor='#E2E8F0';e.target.style.boxShadow='none';e.target.style.background='#F8FAFC'}}
            />
            {search&&<button onClick={()=>setSearch('')} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',width:20,height:20,borderRadius:'50%',background:'#CBD5E1',border:'none',cursor:'pointer',color:'#475569',fontSize:12,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1,padding:0}}>×</button>}
          </div>

          {/* Pattern — styled dropdown */}
          <div style={{position:'relative',flexShrink:0}}>
            <select value={patFilter} onChange={e=>setPatFilter(e.target.value)}
              style={{height:38,paddingLeft:12,paddingRight:30,fontSize:12,fontWeight:600,background:patFilter?'#EEF2FF':'#F8FAFC',border:`1.5px solid ${patFilter?'#6366F1':'#E2E8F0'}`,borderRadius:10,color:patFilter?'#4338CA':'#64748B',appearance:'none',cursor:'pointer',minWidth:145,outline:'none',transition:'all .15s'}}>
              <option value="">All Patterns</option>
              {patterns.map(p=><option key={p} value={p}>{pLabel(p)}</option>)}
            </select>
            <svg style={{position:'absolute',right:9,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:patFilter?'#6366F1':'#94A3B8'}} width="10" height="10" viewBox="0 0 20 20" fill="currentColor"><path d="M5 8l5 5 5-5z"/></svg>

            {v:'RESOLVED',       l:'Resolved',       dot:'#22C55E',color:'#166534',bg:'#DCFCE7', fn:c=>c.status==='RESOLVED'},
            {v:'FALSE_POSITIVE', l:'False Positive', dot:'#94A3B8',color:'#475569',bg:'#F1F5F9', fn:c=>c.status==='FALSE_POSITIVE'},

        {/* Contextual filter-chips footer */}
        {(search||sevFilter||patFilter||caseTypeFilter||(statusFilter&&statusFilter!=='ACTIVE'))&&(

      {/* ── Sort + result count bar ── */}
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:14,padding:'0 2px',flexWrap:'wrap'}}>

        <span style={{fontSize:13,color:'#94A3B8',fontWeight:400,marginRight:4}}>case{filtered.length!==1?'s':''}</span>

          <button key={col} onClick={()=>toggleSort(col)}

      </div>

      {grouped.map(({key,items})=>(
        <div key={key} style={{marginBottom:24}}>
          {groupBy!=='none'&&(
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,padding:'0 2px'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#0F172A'}}>
                {groupBy==='severity' ? <Badge sev={key}/> : groupBy==='role' ? <RoleBadge role={key}/> : groupBy==='pattern' ? pLabel(key) : key}
              </div>
              <span style={{fontSize:12,color:'#94A3B8'}}>{items.length} case{items.length!==1?'s':''}</span>
              <span style={{fontSize:12,color:'#CBD5E1'}}>·</span>

            <div className="card">
              <div className="empty-state">
                <div className="empty-state-icon">🗂</div>
                <div className="empty-state-title">No cases match this filter</div>
                <div className="empty-state-sub">Try a different status, severity, or pattern filter.</div>
              </div>
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {items.map(c=><CaseCard key={c.case_id} c={c} onClick={()=>onCaseClick(c.case_id)}/>)}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── Employees Page ───────────────────────────────────────────────────────────
function EmployeesPage({cases,users}){
  const [selectedRole,setSelectedRole]=useState('');

  const userMap=useMemo(()=>{
    const m={};(users||[]).forEach(u=>{m[u.user_id]=u;});return m;
  },[users]);

  const employees=useMemo(()=>{
    const m={};
    // Seed all roster users first (even those with no cases yet)
    (users||[]).forEach(u=>{
      m[u.user_id]={user_id:u.user_id,user_name:u.user_name||u.user_id,role:backendRoleToDisplay(u.role),cases:[],maxRisk:0};
    });
    cases.forEach(c=>{
      const apiUser=userMap[c.user_id];
      const role=apiUser?backendRoleToDisplay(apiUser.role):inferRole(c.user_id);
      const name=apiUser?.user_name||c.user_name||c.user_id;
      if(!m[c.user_id])m[c.user_id]={user_id:c.user_id,user_name:name,role,cases:[],maxRisk:0};
      m[c.user_id].cases.push(c);
      if(c.risk_score>m[c.user_id].maxRisk)m[c.user_id].maxRisk=c.risk_score;
    });
    return Object.values(m).sort((a,b)=>b.maxRisk-a.maxRisk);
  },[cases,users,userMap]);

  const roles=['Physician','Nursing','Billing','Administration','Other'];
  const filtered=selectedRole?employees.filter(e=>e.role===selectedRole):employees;

  function EmployeeCard({emp}){
    const openCases=emp.cases.filter(isActiveCase);
    const criticalCount=openCases.filter(c=>c.severity==='P0_CRITICAL').length;
    const breachCount=openCases.filter(c=>c.breach_risk).length;
    const patterns=[...new Set(openCases.map(c=>c.pattern_type))];
    const riskColor=emp.maxRisk>=80?'#DC2626':emp.maxRisk>=50?'#EA580C':emp.maxRisk>=30?'#D97706':'#16A34A';

    return(
      <div className="card" style={{padding:'18px 20px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:40,height:40,borderRadius:12,background:ROLE_COLOR[emp.role]+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700,color:ROLE_COLOR[emp.role]}}>
              {emp.user_name?.[0]||'?'}
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:'#0F172A'}}>{emp.user_name}</div>
              <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{emp.user_id}</div>
            </div>
          </div>
          <RoleBadge role={emp.role}/>
        </div>
        <div style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
            <span style={{fontSize:11,color:'#64748B',fontWeight:600}}>Max Risk Score</span>
            <span style={{fontSize:12,fontWeight:700,color:riskColor}}>{emp.maxRisk}</span>
          </div>
          <RiskBar score={emp.maxRisk} color={riskColor}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
          {[{l:'Active Cases',v:openCases.length,c:'#1E293B'},{l:'Critical',v:criticalCount,c:'#DC2626'},{l:'Breach Risk',v:breachCount,c:'#EA580C'}].map(({l,v,c})=>(
            <div key={l} style={{background:'#F8FAFC',borderRadius:8,padding:'8px 10px',textAlign:'center'}}>
              <div style={{fontSize:18,fontWeight:800,color:v>0?c:'#CBD5E1'}}>{v}</div>
              <div style={{fontSize:10,color:'#94A3B8',marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
        {patterns.length>0&&(
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {patterns.map(p=><PatternBadge key={p} pattern={p}/>)}
          </div>
        )}
      </div>
    );
  }

  const roleCounts=useMemo(()=>{
    const m={};employees.forEach(e=>m[e.role]=(m[e.role]||0)+1);return m;
  },[employees]);

  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      {/* Role tabs */}
      <div style={{display:'flex',gap:8,marginBottom:24,flexWrap:'wrap'}}>
        {['', ...roles.filter(r=>roleCounts[r])].map(r=>(
          <button key={r} onClick={()=>setSelectedRole(r)} style={{padding:'8px 16px',borderRadius:8,border:'1.5px solid #E2E8F0',background:selectedRole===r?'#6366F1':'#fff',color:selectedRole===r?'#fff':'#475569',fontSize:13,fontWeight:600,cursor:'pointer',transition:'all .15s'}}>
            {r||'All Departments'} {r?`(${roleCounts[r]||0})`:''}{!r?` (${employees.length})`:''}</button>
        ))}
      </div>

      {/* Role sections */}
      {(selectedRole?[selectedRole]:roles.filter(r=>roleCounts[r])).map(role=>{
        const emps=filtered.filter(e=>e.role===role);
        if(!emps.length)return null;
        return(
          <div key={role} style={{marginBottom:28}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
              <div style={{width:6,height:24,borderRadius:3,background:ROLE_COLOR[role]}}/>
              <h2 style={{fontSize:15,fontWeight:700,color:'#0F172A'}}>{role}</h2>
              <span style={{fontSize:12,color:'#94A3B8'}}>{emps.length} employee{emps.length!==1?'s':''}</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
              {emps.map(e=><EmployeeCard key={e.user_id} emp={e}/>)}
            </div>
          </div>
        );
      })}
      {filtered.length===0&&(
        <div style={{textAlign:'center',padding:'60px 0',color:'#94A3B8'}}>
          <div style={{fontSize:36,marginBottom:12}}>👥</div>
          <div style={{fontSize:14}}>No employees found for this filter.</div>
        </div>
      )}
    </div>
  );
}

// ─── Ingestion Page ───────────────────────────────────────────────────────────
function IngestionPage({ingestion,onRefresh}){
  const manifests=ingestion?.manifests||[];
  const total=ingestion?.total_events_stored||0;
  const errors=ingestion?.total_parse_errors||0;
  const status=ingestion?.overall_status||'UNKNOWN';
  const statusColor={OK:'#16A34A',GAP_DETECTED:'#EA580C',PARSER_ERRORS:'#DC2626',SOURCE_UNREACHABLE:'#DC2626',DEGRADED:'#D97706',UNKNOWN:'#94A3B8'}[status]||'#94A3B8';
  const statusLabel=HEALTH_LABEL[status]||status;

  const timeline=useMemo(()=>[...manifests].reverse().slice(-20),[manifests]);

  return(
    <div className="fade" style={{padding:28,overflow:'auto',flex:1}}>
      {/* Status row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:24}}>
        <KpiCard icon="⚡" label="Telemetry Health" value={statusLabel} sub={status!=='OK'?status:''} color={statusColor}/>
        <KpiCard icon="📦" label="Total Events" value={fmtNum(total)} color="#6366F1"/>
        <KpiCard icon="❌" label="Parse Errors" value={fmtNum(errors)} color={errors>0?'#DC2626':'#16A34A'}/>
        <KpiCard icon="🔄" label="Total Runs" value={fmtNum(manifests.length)} color="#0891B2"/>
      </div>

      {/* Hashes */}
      {(ingestion?.last_success_hash||ingestion?.last_source_hash)&&(
        <div className="card" style={{padding:'16px 20px',marginBottom:20}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {[{l:'Last Manifest Hash',v:ingestion?.last_success_hash},{l:'Last Source Batch Hash',v:ingestion?.last_source_hash}].map(({l,v})=>(
              <div key={l}>
                <div style={{fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:6}}>{l}</div>
                <div className="mono" style={{fontSize:12,color:'#475569',wordBreak:'break-all',background:'#F8FAFC',padding:'8px 12px',borderRadius:8,border:'1px solid #E2E8F0'}}>{v||'-'}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Timeline chart */}
      <ChartCard title="Ingestion Activity" subtitle="Events ingested per run" actions={<button className="btn-secondary" onClick={onRefresh} style={{fontSize:12,padding:'6px 12px'}}>↻ Refresh</button>} >
        {timeline.length>0
          ?<LineChart
             labels={timeline.map(m=>fmtTime(m.started_at))}
             datasets={[{
               label:'Rows Inserted',
               data:timeline.map(m=>m.inserted_count||0),
               borderColor:'#6366F1',backgroundColor:'rgba(99,102,241,.08)',fill:true,
             },{
               label:'Duplicates Skipped',
               data:timeline.map(m=>m.duplicate_count||0),
               borderColor:'#94A3B8',backgroundColor:'transparent',
             }]}/>
          :<EmptyChart message="No ingestion runs recorded"/>}
      </ChartCard>

      {/* Manifests table */}
      <div className="card" style={{marginTop:20,overflow:'hidden'}}>
        <div style={{padding:'16px 20px',borderBottom:'1px solid #F1F5F9'}}>
          <div style={{fontSize:14,fontWeight:700,color:'#1E293B'}}>Ingestion Manifest History</div>
          <div style={{fontSize:12,color:'#94A3B8',marginTop:2}}>Hash-chained audit trail of every ingestion run</div>
        </div>
        <div style={{overflowX:'auto'}}>
          <table>
            <thead>
              <tr>
                <th>#</th><th>Started</th><th>Status</th><th>Source Rows</th><th>Inserted</th><th>Dupes</th><th>Gaps</th><th>Manifest Hash</th>
              </tr>
            </thead>
            <tbody>
              {manifests.slice().reverse().map(m=>(
                <tr key={m.id}>
                  <td style={{fontSize:12,color:'#94A3B8',fontFamily:'monospace'}}>{m.id}</td>
                  <td style={{fontSize:12,color:'#475569',whiteSpace:'nowrap'}}>{fmtTime(m.started_at)}</td>
                  <td>
                    <span className="badge" style={{background:m.status==='SUCCESS'?'#DCFCE7':'#FEE2E2',color:m.status==='SUCCESS'?'#166534':'#991B1B'}}>
                      {m.status}
                    </span>
                  </td>
                  <td style={{fontWeight:600,color:'#1E293B'}}>{fmtNum(m.source_row_count)}</td>
                  <td style={{fontWeight:600,color:'#16A34A'}}>{fmtNum(m.inserted_count)}</td>
                  <td style={{color:'#94A3B8'}}>{fmtNum(m.duplicate_count)}</td>
                  <td>{m.gap_detected?<span className="badge" style={{background:'#FEF9C3',color:'#854D0E'}}>GAP</span>:<span style={{color:'#94A3B8',fontSize:12}}>-</span>}</td>
                  <td><span className="mono" style={{fontSize:11,color:'#6366F1'}}>{m.manifest_hash?.slice(0,16)}…</span></td>
                </tr>
              ))}
              {manifests.length===0&&(
                <tr><td colSpan={8} style={{textAlign:'center',padding:'32px 0',color:'#94A3B8',fontSize:13}}>No ingestion runs yet.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10,marginBottom:16}}>

                const border=!info.exists?'#FCA5A5':missing.length?'#FDE68A':'#86EFAC';
                const bg=!info.exists?'#FEF2F2':missing.length?'#FFFBEB':'#F0FDF4';
                return(
                <div key={tbl} style={{border:`1.5px solid ${border}`,borderRadius:10,padding:'12px 14px',background:bg}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                    <span className="mono" style={{fontSize:12,fontWeight:700,color:'#1E293B'}}>{tbl}</span>
                    <StatusDot ok={allOk}/>
                  </div>
                  {!info.exists
                    ?<div style={{fontSize:11,color:'#DC2626'}}>Table not found</div>
                    :missing.length
                      ?<div style={{fontSize:11,color:'#92400E'}}>Missing: {missing.join(', ')}</div>

              <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:10,padding:'12px 16px'}}>
                <div style={{fontSize:11,fontWeight:700,color:'#92400E',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>Limitations</div>
                {schema.limitations.map((l,i)=><div key={i} style={{fontSize:12,color:'#78350F',marginBottom:4}}>• {l}</div>)}
              </div>
            )}
            <div style={{marginTop:14,display:'flex',gap:8,flexWrap:'wrap'}}>
              <span style={{fontSize:12,color:'#64748B'}}>Ingestion strategy:</span>
              <span className="tag">{schema.selected_ingestion_strategy||'-'}</span>
            </div>
          </>
        )}
      </div>

      {/* Governance disclaimer */}
      <div style={{marginTop:20,background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:12,padding:'16px 20px'}}>
        <div style={{fontSize:11,fontWeight:700,color:'#92400E',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}}>⚖️ Important Disclaimer</div>
        <div style={{fontSize:12,color:'#78350F',lineHeight:1.6}}>
          TrustPulse is a governance decision-support tool. It does not certify HIPAA compliance, make final breach-notification determinations, or provide legal advice. All dispositions require human review by a qualified compliance officer. This tool is a proof-of-concept and is not production-hardened or HIPAA-certified.
        </div>
      </div>
    </div>
  );
}

// ─── Reports Page ────────────────────────────────────────────────────────────
function ReportsPage(){
  const [schedules,setSchedules]=useState([]);
  const [history,setHistory]=useState([]);
  const [loading,setLoading]=useState(false);
  const [runLoading,setRunLoading]=useState(false);
  const [msg,setMsg]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({name:'',frequency:'WEEKLY',include_period_days:7,recipient_email:'',customPeriod:false});
  const [emailRow,setEmailRow]=useState(null);
  const [emailAddr,setEmailAddr]=useState('');

  async function load(){
    setLoading(true);
    try{
      const [s,h]=await Promise.all([
        apiFetch('/api/reports/schedules'),
        apiFetch('/api/reports/history?limit=20'),
      ]);
      if(s)setSchedules(s.schedules||[]);
      if(h)setHistory(h.runs||[]);
    }catch{}
    setLoading(false);
  }

  useEffect(()=>{load();},[]);

  async function runAdhoc(){
    setRunLoading(true);setMsg(null);
    try{
      const r=await apiFetch('/api/reports/run',{method:'POST',body:{period_days:7,report_type:'ADHOC'}});
      if(r&&r.status==='SUCCESS'){
        setMsg({ok:true,text:`Report generated (${(r.file_size_bytes/1024).toFixed(1)} KB). Opening…`});
        await load();
        viewReport(r.run_id);
      }else{
        setMsg({ok:false,text:r?.detail||'Generation failed'});
      }
    }catch(e){setMsg({ok:false,text:String(e)});}
    setRunLoading(false);
  }

  async function createSchedule(){
    setMsg(null);
    try{
      const body={
        name:form.name,
        frequency:form.frequency,
        frequency_days:form.frequency==='CUSTOM'?parseInt(form.include_period_days,10)||7:7,
        include_period_days:parseInt(form.include_period_days,10)||7,
        recipient_email:form.recipient_email||null,
      };
      await apiFetch('/api/reports/schedules',{method:'POST',body});
      setShowForm(false);
      setMsg({ok:true,text:'Schedule created.'});
      await load();
    }catch(e){setMsg({ok:false,text:String(e)});}
  }

  async function deleteSchedule(id){
    if(!confirm('Delete this schedule?'))return;
    await apiFetch(`/api/reports/schedules/${id}`,{method:'DELETE'});
    await load();
  }

  async function runSchedule(id){
    setRunLoading(true);setMsg(null);
    try{
      const r=await apiFetch('/api/reports/run',{method:'POST',body:{schedule_id:id,period_days:7,report_type:'ADHOC'}});
      if(r&&r.status==='SUCCESS'){
        setMsg({ok:true,text:'Report generated. Opening…'});
        await load();
        viewReport(r.run_id);
      }
    }catch(e){setMsg({ok:false,text:String(e)});}
    setRunLoading(false);
  }

  async function sendEmail(runId,addr){
    if(!addr||!addr.includes('@')){setMsg({ok:false,text:'Enter a valid email address.'});return;}
    try{
      await apiFetch(`/api/reports/history/${runId}/send`,{method:'POST',body:{to:addr}});
      setMsg({ok:true,text:`Report emailed to ${addr}.`});
      setEmailRow(null);setEmailAddr('');
    }catch(e){setMsg({ok:false,text:String(e)});}
  }

  const freqColors={WEEKLY:'#6366F1',MONTHLY:'#0284C7',QUARTERLY:'#059669',CUSTOM:'#9333EA',ADHOC:'#64748B'};

  return(
    <div style={{flex:1,overflowY:'auto',padding:'28px 32px',background:'#F8FAFC'}}>

      {/* Top bar */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
        <div>
          <div style={{fontWeight:700,fontSize:18,color:'#0F172A'}}>Governance Reports</div>
          <div style={{fontSize:12,color:'#64748B',marginTop:2}}>Generate HIPAA audit-governance reports - download as HTML/PDF</div>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn-outline" onClick={()=>{setShowForm(f=>!f);setForm({name:'',frequency:'WEEKLY',include_period_days:7,recipient_email:'',customPeriod:false});}}>+ New Schedule</button>
          <button className="btn-primary" onClick={runAdhoc} disabled={runLoading}>
            {runLoading?'Generating…':'▶ Run Ad-hoc Report'}
          </button>
        </div>
      </div>

      {msg&&(
        <div style={{background:msg.ok?'#DCFCE7':'#FEE2E2',color:msg.ok?'#166534':'#991B1B',
                     borderRadius:8,padding:'10px 16px',marginBottom:16,fontSize:13}}>
          {msg.text}
        </div>
