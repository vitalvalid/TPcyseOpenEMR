<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustPulse - Healthcare Governance Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F4F6FA;color:#1E293B;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#94A3B8;border-radius:4px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);border:1px solid #E8EDF4;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 4px 24px rgba(15,23,42,.10),0 1px 4px rgba(15,23,42,.06);border-color:#D4DCE8}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:#94A3B8;transition:all .15s;white-space:nowrap}
.nav-link:hover{background:rgba(255,255,255,.06);color:#CBD5E1}
.nav-link.active{background:rgba(99,102,241,.2);color:#A5B4FC}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em}
.kpi-card{background:#fff;border-radius:14px;padding:20px 24px;box-shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);border:1px solid #E8EDF4}
.risk-track{background:#E2E8F0;border-radius:99px;height:6px;overflow:hidden;flex:1}
.risk-fill{height:100%;border-radius:99px;transition:width .6s ease}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;right:0;top:0;bottom:0;background:#fff;z-index:50;box-shadow:-6px 0 36px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden;will-change:width}
@media(max-width:700px){.drawer{width:100%!important;min-width:0!important}}
.drawer-handle{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:60;transition:background .15s;border-radius:3px 0 0 3px}
.drawer-handle:hover,.drawer-handle.active{background:rgba(99,102,241,.28)}
.drawer-body{flex:1;overflow-y:auto;padding:24px}
.fade{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.slide{animation:sl .22s ease}
@keyframes sl{from{transform:translateX(100%)}to{transform:translateX(0)}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748B;border-bottom:2px solid #F1F5F9;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #F8FAFC;vertical-align:middle}
tr.clickable:hover td{background:#F8FAFC;cursor:pointer}
input,select{font-family:inherit;border:1.5px solid #E2E8F0;border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;color:#1E293B}
input:focus,select:focus{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
button{font-family:inherit;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#4F46E5,#4338CA);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;transition:background .2s,transform .12s,box-shadow .2s;box-shadow:0 2px 8px rgba(79,70,229,.28)}
.btn-primary:hover{background:linear-gradient(135deg,#6366F1,#4F46E5);box-shadow:0 4px 18px rgba(79,70,229,.38);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.98);box-shadow:0 1px 4px rgba(79,70,229,.2)}
.btn-secondary{background:#F1F5F9;color:#475569;border:1.5px solid #E2E8F0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:500;transition:all .15s}
.btn-secondary:hover{background:#E2E8F0;border-color:#CBD5E1}
.btn-outline{background:transparent;color:#475569;border:1.5px solid #CBD5E1;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-outline:hover{background:#F1F5F9;border-color:#94A3B8}
.section-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94A3B8;margin-bottom:12px}
.chart-container{position:relative;width:100%}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;background:#EEF2FF;color:#4338CA}
/* ─── New design system additions ─── */
.form-lbl{font-size:11px;font-weight:600;color:#475569;display:block;margin-bottom:4px}
.tl{border-left:2px solid #E2E8F0;margin-left:5px;padding-left:20px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:4px;width:10px;height:10px;border-radius:50%;background:#E2E8F0;border:2px solid #fff;box-shadow:0 0 0 2px #CBD5E1}
.tl-dot.first{background:linear-gradient(135deg,#6366F1,#4338CA);box-shadow:0 0 0 2px #C7D2FE}
details>summary{cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;font-size:12px;font-weight:600;color:#475569;list-style:none;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▶  ';font-size:9px;color:#94A3B8;flex-shrink:0;transition:transform .2s;display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}
details>summary:hover{background:#F1F5F9;color:#1E293B}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 0;color:#94A3B8;gap:10px}
.empty-state-icon{font-size:36px;opacity:.5}
.empty-state-title{font-size:14px;font-weight:600;color:#64748B}
.empty-state-sub{font-size:12px;color:#94A3B8}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 10px;border-radius:99px;background:#EEF2FF;color:#4338CA;font-size:11px;font-weight:600;border:1px solid #C7D2FE;white-space:nowrap}
.filter-chip-x{width:14px;height:14px;border-radius:50%;border:none;background:#818CF8;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;padding:0;line-height:1;flex-shrink:0}
.nav-sec-label{font-size:9.5px;font-weight:800;color:#475569;letter-spacing:.1em;text-transform:uppercase;padding:12px 10px 4px;display:block}
@keyframes kpi-pulse-dot{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}70%{box-shadow:0 0 0 8px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.case-card{background:#fff;border-radius:12px;border:1px solid #E8EDF4;cursor:pointer;transition:box-shadow .18s,transform .14s,border-color .18s;position:relative}
.case-card:hover{box-shadow:0 6px 28px rgba(15,23,42,.11);transform:translateY(-1px);border-color:#C7D2FE}
.tab-bar{display:flex;border-bottom:2px solid #E2E8F0;margin-bottom:18px;gap:0}
.tab-btn{padding:7px 15px;font-size:12px;font-weight:600;border:none;background:transparent;cursor:pointer;color:#64748B;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s,background .15s;outline:none;font-family:inherit;border-radius:6px 6px 0 0}
.tab-btn:hover{color:#4338CA;background:rgba(99,102,241,.05)}
.tab-btn.active{color:#6366F1;border-bottom-color:#6366F1;background:rgba(99,102,241,.06)}
.sum-tile{background:#F8FAFC;border-radius:10px;padding:10px 12px;border:1px solid #F1F5F9;transition:background .12s}
.sum-tile-lbl{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sum-tile-val{font-size:12px;font-weight:700;color:#1E293B;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why-review{background:linear-gradient(135deg,#EFF6FF 60%,#F0F9FF 100%);border-left:3px solid #3B82F6;border-radius:0 12px 12px 0;padding:13px 15px;margin-bottom:14px;border-top:1px solid #BFDBFE;border-right:1px solid #BFDBFE;border-bottom:1px solid #BFDBFE}
.action-panel{border:1.5px solid #6366F1;border-radius:12px;padding:16px;margin-bottom:20px;background:linear-gradient(180deg,#FAFAFE 0%,#F5F3FF 100%);outline:none;scroll-margin-top:18px}
.tl-entry{background:#F8FAFC;border-radius:10px;padding:10px 14px;border:1px solid #F1F5F9;transition:background .12s}
.tl-entry:hover{background:#F1F5F9}
.action-notice-ok{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:13px;color:#166534;font-weight:600}
.action-notice-info{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:12px;color:#1D4ED8}
.stat-row{display:flex;border-radius:12px;border:1px solid #E8EDF4;overflow:hidden;margin-bottom:14px;background:#fff}
.stat-cell{flex:1;padding:10px 13px;border-right:1px solid #F1F5F9;min-width:0}
.stat-cell:last-child{border-right:none}
.stat-cell-lbl{font-size:9px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.stat-cell-val{font-size:13px;font-weight:700;color:#0F172A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.action-pill{padding:5px 13px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border-width:1.5px;border-style:solid;white-space:nowrap;font-family:inherit;line-height:1.4}
.action-pill:hover{filter:brightness(.96)}
.drawer-user-strip{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid #F1F5F9;background:#FAFBFC}
.drawer-avatar{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{background:linear-gradient(90deg,#F1F5F9 25%,#E8EDF4 50%,#F1F5F9 75%);background-size:800px 100%;animation:shimmer 1.4s ease infinite;border-radius:6px}
.review-guide-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1000px,92vw);min-width:620px;min-height:420px;max-width:96vw;max-height:94vh;overflow:auto;resize:both;background:#F8FAFC;border-radius:24px;box-shadow:0 28px 80px rgba(15,23,42,.22);z-index:80;display:flex;flex-direction:column;animation:reviewGuideIn .2s ease;border:1px solid rgba(226,232,240,.9)}
.review-guide-hero{padding:24px 28px 18px;color:#fff;position:relative;overflow:hidden}
.review-guide-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:999px;background:rgba(255,255,255,.10);filter:blur(3px)}
.review-guide-hero-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.84;margin-bottom:10px;position:relative}
.review-guide-hero-title{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.03em;position:relative}
.review-guide-hero-subtitle{font-size:14px;opacity:.88;margin-top:8px;position:relative}
.review-guide-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative}
.review-guide-chip{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
.review-guide-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:18px;padding:20px 22px 0;overflow:auto}
.review-guide-stack{display:flex;flex-direction:column;gap:16px}
.review-guide-card{background:#fff;border:1px solid #E2E8F0;border-radius:20px;padding:18px 18px 16px;box-shadow:0 10px 24px rgba(15,23,42,.05)}
.review-guide-card-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#0F172A;margin-bottom:12px}
.review-signal-card{position:relative;overflow:hidden}
.review-signal-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--guide-accent,#4F46E5)}
.review-signal-text{font-size:18px;font-weight:600;line-height:1.45;color:#0F172A;padding-left:8px}
.review-signal-metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-left:8px}
.review-signal-metric{padding:7px 10px;border-radius:999px;background:#F8FAFC;color:#334155;font-size:12px;font-weight:600;border:1px solid #E2E8F0}
.review-check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-radius:12px}
.review-check-bullet{width:6px;height:6px;border-radius:999px;background:var(--guide-accent,#4F46E5);margin-top:8px;flex-shrink:0;opacity:.78}
.review-check-text{font-size:14px;line-height:1.5;color:#334155}
.review-action-panel{background:linear-gradient(180deg,#FFFFFF 0%,#F8FAFC 100%);border:1px solid #D6E3FF;box-shadow:0 18px 32px rgba(15,23,42,.08)}
.review-action-badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--guide-accent-soft,#EEF2FF);color:var(--guide-accent,#4F46E5);font-size:12px;font-weight:700;margin-bottom:10px}
.review-action-name{font-size:26px;font-weight:700;letter-spacing:-.03em;color:#0F172A;line-height:1.05;margin-bottom:8px}
.review-action-desc{font-size:14px;color:#475569;line-height:1.55;margin-bottom:14px}
.review-message-label{font-size:12px;font-weight:700;color:#64748B;margin-bottom:8px}
.review-message-preview{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:14px 15px;position:relative}
.review-message-preview::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:999px;background:var(--guide-accent,#4F46E5)}
.review-message-preview-text{font-size:14px;line-height:1.65;color:#1E293B;padding-left:12px}
.review-context-card{background:#F8FAFC;border-color:#E2E8F0}
.review-context-copy{font-size:13px;color:#64748B;line-height:1.55}
.review-guide-footer{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px 20px;background:rgba(248,250,252,.96);border-top:1px solid #E2E8F0;margin-top:8px}
.review-applied-state{font-size:13px;font-weight:600;color:var(--guide-accent,#4F46E5);opacity:0;transform:translateY(4px);transition:all .18s}
.review-applied-state.visible{opacity:1;transform:translateY(0)}
.review-guide-footer-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@keyframes reviewGuideIn{from{opacity:0;transform:translate(-50%,-49%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:860px){
  .review-guide-modal{width:min(720px,94vw)}
  .review-guide-layout{grid-template-columns:1fr}
}
@media(max-width:640px){
  .review-guide-modal{width:calc(100vw - 18px);min-width:0;max-height:calc(100vh - 18px);border-radius:20px;resize:none}
  .review-guide-hero{padding:22px 18px 18px}
  .review-guide-hero-title{font-size:24px}
  .review-guide-layout{padding:16px 16px 0}
  .review-guide-footer{padding:14px 16px 16px;align-items:flex-start;flex-direction:column}
  .review-guide-footer-actions{width:100%}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

// ─── Palette & utils ──────────────────────────────────────────────────────────
const SEV = {
  P0_CRITICAL:{bg:'#FEE2E2',text:'#991B1B',dot:'#DC2626',label:'P0 Critical',color:'#DC2626'},
  P1_HIGH:    {bg:'#FFEDD5',text:'#9A3412',dot:'#EA580C',label:'P1 High',    color:'#EA580C'},
  P2_MEDIUM:  {bg:'#FEF9C3',text:'#854D0E',dot:'#D97706',label:'P2 Medium',  color:'#D97706'},
  P3_LOW:     {bg:'#DCFCE7',text:'#166534',dot:'#16A34A',label:'P3 Low',     color:'#16A34A'},
};
const PATTERN_LABEL = {
  CREDENTIAL_RISK:'Credential risk',INSIDER_SNOOPING:'Insider snooping',
  VOLUME_SPIKE:'Volume spike',OFF_HOURS:'After-hours access',DATA_EXPORT:'Data export',
  CROSS_DEPT:'Cross-department',CROSS_PATIENT:'Cross-patient',
  BULK_ACCESS:'Bulk access',
  VIP_NO_APPOINTMENT:'VIP/no appointment',
  AFTER_HOURS_LOGIN_ATTEMPT:'After-hours login',
  FAILED_LOGIN_ACTIVITY:'Failed login activity',
  FAILED_LOGIN_BURST:'Failed login burst',
  SUCCESSFUL_LOGIN_AFTER_FAILURES:'Login after failures',
  PATIENT_ACCESS_AFTER_AUTH_FAILURES:'Access after auth failures',
  AUTHENTICATION_REVIEW:'Authentication review',
  ACCOUNT_ACCESS_REVIEW:'Account access review',
  ACCOUNT_MISUSE_REVIEW:'Account misuse review',
  UNKNOWN:'Unknown pattern',
};
const PATTERN_COLOR = {
  CREDENTIAL_RISK:'#7C3AED',INSIDER_SNOOPING:'#DC2626',VOLUME_SPIKE:'#2563EB',
  OFF_HOURS:'#D97706',DATA_EXPORT:'#0891B2',CROSS_DEPT:'#DB2777',CROSS_PATIENT:'#059669',
  BULK_ACCESS:'#2563EB',VIP_NO_APPOINTMENT:'#4F46E5',
  AFTER_HOURS_LOGIN_ATTEMPT:'#B45309',
  FAILED_LOGIN_ACTIVITY:'#475569',
  FAILED_LOGIN_BURST:'#C2410C',
  SUCCESSFUL_LOGIN_AFTER_FAILURES:'#3730A3',
  PATIENT_ACCESS_AFTER_AUTH_FAILURES:'#4338CA',
  AUTHENTICATION_REVIEW:'#475569',
  ACCOUNT_ACCESS_REVIEW:'#3730A3',
  ACCOUNT_MISUSE_REVIEW:'#7C2D12',
  UNKNOWN:'#6B7280',
};
const CASE_TYPE_LABEL = {
  PATIENT_ACCESS_REVIEW:'Patient access review',
  AUTHENTICATION_REVIEW:'Authentication review',
  ACCOUNT_ACCESS_REVIEW:'Account access review',
  ACCOUNT_MISUSE_REVIEW:'Account misuse review',
  GENERIC_REVIEW:'Review case',
};
const ROLE_COLOR = {Physician:'#0891B2',Nursing:'#7C3AED',Billing:'#D97706',Administration:'#6366F1',Other:'#6B7280'};
const ACTIVE_CASE_STATUSES = new Set(['OPEN','UNDER_REVIEW','NEEDS_CONTEXT','ESCALATED','REOPENED']);
const isActiveCase = c => ACTIVE_CASE_STATUSES.has(c.status);
const isAuthCase = c => ['AUTHENTICATION_REVIEW','ACCOUNT_ACCESS_REVIEW','ACCOUNT_MISUSE_REVIEW'].includes((c?.case_type||'').toUpperCase());
const CASE_ACTION_OPTIONS = {
  OPEN: [
    ['REVIEW_STARTED','Review started'],
    ['ESCALATED','Escalated'],
    ['COMMENT_ADDED','Comment added'],
  ],
  UNDER_REVIEW: [
    ['REQUEST_CONTEXT','Request context'],
    ['ESCALATED','Escalated'],
    ['RESOLVED_AUTHORIZED_ACCESS','Resolved - authorized access'],
    ['RESOLVED_NO_ISSUE','Resolved - no issue'],
    ['FALSE_POSITIVE','False positive'],
    ['COMMENT_ADDED','Comment added'],
  ],
  NEEDS_CONTEXT: [
    ['COMMENT_ADDED','Comment added'],
    ['ESCALATED','Escalated'],
    ['RESOLVED_AUTHORIZED_ACCESS','Resolved - authorized access'],
    ['RESOLVED_NO_ISSUE','Resolved - no issue'],
    ['FALSE_POSITIVE','False positive'],
  ],
  ESCALATED: [
    ['COMMENT_ADDED','Comment added'],
    ['RESOLVED_AUTHORIZED_ACCESS','Resolved - authorized access'],
    ['RESOLVED_NO_ISSUE','Resolved - no issue'],
    ['FALSE_POSITIVE','False positive'],
  ],
  RESOLVED: [
    ['REOPENED','Reopened'],
    ['COMMENT_ADDED','Comment added'],
    ['EVIDENCE_EXPORTED','Evidence exported'],
  ],
  FALSE_POSITIVE: [
    ['REOPENED','Reopened'],
    ['COMMENT_ADDED','Comment added'],
    ['EVIDENCE_EXPORTED','Evidence exported'],
  ],
  SUPPRESSED: [
    ['REOPENED','Reopened'],
    ['COMMENT_ADDED','Comment added'],
    ['EVIDENCE_EXPORTED','Evidence exported'],
  ],
};
const TRIAGE_COLOR = {TODAY:'#DC2626',THIS_WEEK:'#EA580C',BACKLOG:'#6366F1',SNOOZED:'#6B7280'};
const HEALTH_LABEL={
  OK:'Healthy',GAP_DETECTED:'Coverage Warning',PARSER_ERRORS:'Parser Errors',
  SOURCE_UNREACHABLE:'Source Unreachable',UNSUPPORTED_SCHEMA:'Unsupported Schema',
  DEGRADED:'Degraded',UNKNOWN:'Unknown',
};
const ROUTE_TO_PAGE = {
  dashboard:'dashboard',
  cases:'cases',
  employees:'employees',
  ingestion:'ingestion',
  reports:'reports',
  connection:'system',
  config:'review_config',
  users:'admin_users',
  'permission-groups':'admin_permissions',
  'data-privacy':'admin_privacy',
  settings:'admin_settings',
};
const PAGE_TO_ROUTE = Object.fromEntries(Object.entries(ROUTE_TO_PAGE).map(([route,page])=>[page,route]));

function inferRole(uid=''){
  const u=uid.toLowerCase();
  if(u.startsWith('dr_'))return 'Physician';
  if(u.startsWith('nurse_'))return 'Nursing';
  if(u.startsWith('billing_'))return 'Billing';
  if(u.includes('admin')||u==='admin')return 'Administration';
  return 'Other';
}
function backendRoleToDisplay(r=''){
  return {clinician:'Physician',nurse:'Nursing',billing:'Billing',admin:'Administration',it:'Other',staff:'Other'}[r]||'Other';
}
const pLabel=p=>PATTERN_LABEL[p]||String(p||'Unknown pattern').toLowerCase().replace(/_/g,' ').replace(/\b\w/g, ch=>ch.toUpperCase());
const caseTypeLabel=t=>CASE_TYPE_LABEL[t]||String(t||'Review case').toLowerCase().replace(/_/g,' ').replace(/\b\w/g, ch=>ch.toUpperCase());
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'-';
const fmtTime=d=>d?new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const fmtNum=n=>n==null?'-':Number(n).toLocaleString();
function fmtRelTime(d){
  if(!d)return '-';
  const s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60)return 'just now';
  if(s<3600)return `${Math.floor(s/60)}m ago`;
  if(s<86400)return `${Math.floor(s/3600)}h ago`;
  if(s<604800)return `${Math.floor(s/86400)}d ago`;
  return fmtDate(d);
}

const TOKEN_KEY='tp_token';
const USER_KEY='tp_user';
const getToken=()=>localStorage.getItem(TOKEN_KEY);
const setToken=t=>t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY);
const getSavedUser=()=>{try{return JSON.parse(localStorage.getItem(USER_KEY)||'null')}catch{return null}};
const saveUser=u=>u?localStorage.setItem(USER_KEY,JSON.stringify(u)):localStorage.removeItem(USER_KEY);
const hasPermission=(user,perm)=>Array.isArray(user?.permissions)&&user.permissions.includes(perm);
function parseHashRoute(hash=window.location.hash){
  const cleaned=(hash||'').replace(/^#\/?/,'').trim();
  const parts=cleaned.split('/').filter(Boolean);
  if(parts.length===0) return {page:'dashboard',caseId:null,redirect:false};
  const routeKey=parts[0];
  if(routeKey==='cases'){
    return {page:'cases',caseId:parts[1]?decodeURIComponent(parts[1]):null,redirect:false};
  }
  const page=ROUTE_TO_PAGE[routeKey];
  if(page) return {page,caseId:null,redirect:false};
  return {page:'dashboard',caseId:null,redirect:true};
}
function buildHashRoute(page='dashboard',caseId=null){
  const route=PAGE_TO_ROUTE[page]||'dashboard';
  if(page==='cases'&&caseId) return `#/${route}/${encodeURIComponent(caseId)}`;
  return `#/${route}`;
}
function applyHashRoute(page='dashboard',caseId=null){
  const nextHash=buildHashRoute(page,caseId);
  if(window.location.hash!==nextHash){
    window.location.hash=nextHash;
  }
}

async function apiFetch(path,{method='GET',body}={}){
  const tok=getToken();
  const res=await fetch(path,{
    method,
    headers:{'Content-Type':'application/json',...(tok?{Authorization:`Bearer ${tok}`}:{})},
    ...(body?{body:JSON.stringify(body)}:{}),
  });
  if(res.status===401){setToken(null);saveUser(null);window.location.reload();return null}
  if(!res.ok)throw new Error(await res.text());
  return res.json();
}

async function _fetchReportHtml(runId){
  const res=await fetch(`/api/reports/history/${runId}`,{
    headers:{Authorization:`Bearer ${getToken()}`},
  });
  if(res.status===401){setToken(null);window.location.reload();return null;}
  if(!res.ok)throw new Error(await res.text());
  return res.text();
}

async function viewReport(runId){
  try{
    const html=await _fetchReportHtml(runId);
    if(!html)return;
    window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank');
  }catch(e){alert('Could not open report: '+e.message);}
}

async function downloadPdf(runId){
  try{
    const html=await _fetchReportHtml(runId);
    if(!html)return;
    const printHtml=html.replace('</head>',
      '<style>@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>'+
      '<script>window.addEventListener("load",function(){setTimeout(window.print,400)});<\/script></head>');
    window.open(URL.createObjectURL(new Blob([printHtml],{type:'text/html'})),'_blank');
  }catch(e){alert('Could not prepare PDF: '+e.message);}
}

function useCountUp(target,duration=750){
  const [val,setVal]=useState(0);
  useEffect(()=>{
    if(!Number.isFinite(target)||target<=0){setVal(target||0);return;}
    let start=null;
    const id=requestAnimationFrame(function step(ts){
      if(!start)start=ts;
      const p=Math.min((ts-start)/duration,1);
      const ease=1-Math.pow(1-p,3);
      setVal(Math.round(target*ease));
      if(p<1)requestAnimationFrame(step);
    });
    return()=>cancelAnimationFrame(id);
  },[target]);
  return val;
}

function RiskRing({score,size=48,strokeWidth=3.5}){
  const r=size/2-strokeWidth;
  const circ=2*Math.PI*r;
  const fill=(Math.min(score||0,100)/100)*circ;
  const color=(score||0)>=80?'#DC2626':(score||0)>=50?'#EA580C':(score||0)>=30?'#D97706':'#16A34A';
  const cx=size/2,cy=size/2;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#E8EDF4" strokeWidth={strokeWidth}/>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={strokeWidth}
        strokeDasharray={circ} strokeDashoffset={circ-fill} strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`}
        style={{transition:'stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)'}}/>
      <text x={cx} y={cy} textAnchor="middle" dominantBaseline="central"
        style={{fontSize:size>44?12:10,fontWeight:700,fill:color,fontFamily:"'Inter',sans-serif"}}>{score||0}</text>
    </svg>
  );
}

  const [email,setEmail]=useState('admin@trustpulse.local');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  async function submit(e){
    e.preventDefault();setErr('');setLoading(true);
    try{
      const data=await apiFetch('/api/auth/login',{method:'POST',body:{email,password:pass}});
      if(data){onLogin(data.access_token,data.user)}
    }catch(ex){setErr('Invalid email or password.')}
    setLoading(false);
  }
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0F172A 0%,#1E293B 50%,#0F172A 100%)'}}>
      <div style={{width:420,padding:48,background:'#fff',borderRadius:20,boxShadow:'0 24px 80px rgba(0,0,0,.25)'}}>
        <div style={{textAlign:'center',marginBottom:36}}>
          <div style={{width:56,height:56,borderRadius:16,background:'#EEF2FF',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,margin:'0 auto 16px'}}>🛡️</div>
          <h2 style={{fontSize:24,fontWeight:800,color:'#0F172A',letterSpacing:'-.02em'}}>TrustPulse</h2>
          <p style={{fontSize:13,color:'#64748B',marginTop:6}}>Healthcare Governance Platform</p>
        </div>
        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Email address</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{width:'100%'}} placeholder="admin@trustpulse.local" required/>
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Password</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} style={{width:'100%'}} placeholder="••••••••" required/>
          </div>
          {err&&<div style={{background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:8,padding:'10px 14px',fontSize:13,color:'#DC2626'}}>{err}</div>}
          <button type="submit" className="btn-primary" style={{marginTop:4,padding:'12px 0',fontSize:14}} disabled={loading}>
            {loading?'Signing in…':'Sign in'}
          </button>
        </form>
        <div style={{marginTop:24,padding:'14px 16px',background:'#F8FAFC',borderRadius:10,border:'1px solid #E2E8F0'}}>
          <div style={{fontSize:11,fontWeight:700,color:'#64748B',marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>Default credentials</div>
          <div style={{fontSize:12,color:'#475569',display:'flex',flexDirection:'column',gap:4}}>
            <span><b>Email:</b> admin@trustpulse.local</span>
            <span><b>Password:</b> TrustPulse@2026!</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function buildMissingInfoSummary(paa){
  const ctx=paa?.missing_context||[];
  if(!ctx.length)return null;
  if(ctx.some(m=>(m.context||'').toLowerCase().includes('appointment'))||ctx.some(m=>(m.context||'').toLowerCase().includes('work queue'))){
    return 'TrustPulse could not verify appointment or work-queue context from the available OpenEMR logs.';
  }
  if(ctx.some(m=>(m.context||'').toLowerCase().includes('care relationship'))){
    return 'TrustPulse could not verify care-relationship context from the available OpenEMR logs.';
  }
  if(ctx.some(m=>(m.context||'').toLowerCase().includes('ip'))){
    return 'TrustPulse could not verify source or workstation context from the available OpenEMR logs.';
  }
  return 'TrustPulse could not verify all supporting context from the available OpenEMR logs.';
}

  if(caseType.includes('AUTHENTICATION')||caseType.includes('ACCOUNT_ACCESS')||caseType.includes('ACCOUNT_MISUSE')){
    return {
      hero:'linear-gradient(135deg, #1E3A8A 0%, #B45309 100%)',
      accent:'#D97706',
      accentSoft:'#FEF3C7',
      border:'#FCD34D',
      surface:'#FFF7ED',

      accent:'#0F766E',
      accentSoft:'#CCFBF1',
      border:'#99F6E4',
      surface:'#F0FDFA',
    };
  }
  if(roleLower.includes('admin')||roleLower.includes('front')||roleLower.includes('reception')){

}
function reviewGuideSubtitle(c,paa){
  const role=(paa?.subject_role&&paa.subject_role!=='UNKNOWN')?paa.subject_role:inferRole(c.user_id);
  const roleLower=(role||'').toLowerCase();
  const caseType=(c.case_type||paa?.case_type||'').toUpperCase();
  if(caseType.includes('AUTHENTICATION')||caseType.includes('ACCOUNT_ACCESS')||caseType.includes('ACCOUNT_MISUSE')) return 'Account access review';
  if(roleLower.includes('bill')) return 'Billing access review';
  if(roleLower.includes('physician')||roleLower.includes('doctor')||roleLower.includes('provider')||roleLower.includes('clinician')) return 'Physician access review';
  if(roleLower.includes('nurs')) return 'Nursing access review';
  if(roleLower.includes('admin')||roleLower.includes('front')||roleLower.includes('reception')) return 'Administrative access review';
  return 'Access review';
}
function reviewGuideUserLine(c,paa){
  const role=(paa?.subject_role&&paa.subject_role!=='UNKNOWN')?paa.subject_role:inferRole(c.user_id);
  return `${c.user_name||c.user_id} · ${role||'User'}`;
}
function reviewGuideSummary(c,paa){
  const role=(paa?.subject_role&&paa.subject_role!=='UNKNOWN')?paa.subject_role:inferRole(c.user_id);
  const roleLower=(role||'').toLowerCase();
  const caseType=(c.case_type||paa?.case_type||'').toUpperCase();
  if(caseType.includes('AUTHENTICATION')||caseType.includes('ACCOUNT_ACCESS')||caseType.includes('ACCOUNT_MISUSE')){
    if((c.pattern_type||'')==='PATIENT_ACCESS_AFTER_AUTH_FAILURES') return 'Failed login attempts were followed by patient-record access.';
    if((c.pattern_type||'')==='SUCCESSFUL_LOGIN_AFTER_FAILURES') return 'Failed login attempts were followed by a successful login.';
    return 'This account had repeated failed login attempts during the review window.';
  }
  if(roleLower.includes('bill')){
    return 'This billing user accessed more patient records than expected for this review window.';
  }
  if(roleLower.includes('physician')||roleLower.includes('doctor')||roleLower.includes('provider')||roleLower.includes('clinician')){
    return 'This clinician accessed more patient records than expected for this review window.';
  }
  if(roleLower.includes('nurs')){
    return 'This nursing user accessed more patient records than expected for this review window.';
  }
  if(roleLower.includes('admin')||roleLower.includes('front')||roleLower.includes('reception')){
    return 'This administrative user accessed more patient records than expected for this review window.';
  }
  return 'This user activity needs review before the case is closed.';
}
function reviewGuideChecks(c,paa){
  if((paa?.things_to_confirm?.items||[]).length>0){
    return (paa.things_to_confirm.items||[]).slice(0,3);
  }
  const role=(paa?.subject_role&&paa.subject_role!=='UNKNOWN')?paa.subject_role:inferRole(c.user_id);
  const roleLower=(role||'').toLowerCase();
  const caseType=(c.case_type||paa?.case_type||'').toUpperCase();
  if(caseType.includes('AUTHENTICATION')||caseType.includes('ACCOUNT_ACCESS')||caseType.includes('ACCOUNT_MISUSE')){
    return [
      'Whether the login activity was expected for this user',
      'Whether the device or work location matches normal use',
      'IT or security review if the activity remains unclear',
    ];
  }
  if(roleLower.includes('bill')){
    return [
      'Billing, payment, claims, or insurance reason',
      'Assigned billing work queue or follow-up list',
      'Supervisor confirmation if unclear',
    ];
  }
  if(roleLower.includes('physician')||roleLower.includes('doctor')||roleLower.includes('provider')||roleLower.includes('clinician')){
    return [
      'Treatment, on-call, or care-coordination reason',
      'Scheduled, admitted, or assigned patients',
      'Timing consistent with clinical workflow',
    ];
  }
  if(roleLower.includes('nurs')){
    return [
      'Assigned shift, triage, or care-duty reason',
      'Patients connected to current care responsibilities',
      'Supervisor confirmation if unclear',
    ];
  }
  if(roleLower.includes('admin')||roleLower.includes('front')||roleLower.includes('reception')){
    return [
      'Scheduling, registration, insurance, or administrative reason',
      'Whether clinical-detail access was necessary',
      'Supervisor confirmation if unclear',
    ];
  }
  return (paa?.quick_review_checks||[]).slice(0,3);
}
function reviewGuideActionLabel(action=''){
  return (action||'').replace(/_/g,' ').toLowerCase().replace(/\b\w/g, ch=>ch.toUpperCase());
}
function reviewGuideActionDescription(c,paa,pri){
  const role=(paa?.subject_role&&paa.subject_role!=='UNKNOWN')?paa.subject_role:inferRole(c.user_id);
  const roleLower=(role||'').toLowerCase();
  const caseType=(c.case_type||paa?.case_type||'').toUpperCase();
  if(caseType.includes('AUTHENTICATION')||caseType.includes('ACCOUNT_ACCESS')||caseType.includes('ACCOUNT_MISUSE')){
    if((c.pattern_type||'')==='PATIENT_ACCESS_AFTER_AUTH_FAILURES'){
      return 'Request account confirmation or escalate to IT/security if the login and patient access are not recognized.';
    }
    return 'Ask the appropriate role to confirm whether this login and access activity was expected before closing this case.';
  }
  if(roleLower.includes('bill')){
    return 'Ask the billing lead or supervisor to confirm the operational reason before closing this case.';
  }
  if(roleLower.includes('admin')||roleLower.includes('front')||roleLower.includes('reception')){
    return 'Ask the administrative lead to confirm the access reason before closing this case.';
  }
  if(roleLower.includes('nurs')){
    return 'Ask the care team lead to confirm the shift or care-duty reason before closing this case.';
  }
  return 'Ask the appropriate role to confirm the access reason before closing this case.';
}
function suggestedNextStepLabel(c,paa){
  const action=paa?.primary_suggested_action||c?.primary_suggested_action;
  const caseType=(c?.case_type||paa?.case_type||'').toUpperCase();
  if(!action) return '';
  if(caseType.includes('AUTHENTICATION')||caseType.includes('ACCOUNT_ACCESS')||caseType.includes('ACCOUNT_MISUSE')){
    if(action.action==='REQUEST_CONTEXT') return action.action_label||'Request account confirmation';
    if(action.action==='ESCALATED') return 'Escalate to IT/security review';
  }
  return action.action_label||reviewGuideActionLabel(action.action||'');
}
function reviewGuideSignalChips(c,paa){
  const chips=[];
  const linked=paa?.linked_event_count||c.event_count||0;
  if(linked) chips.push(`${fmtNum(linked)} linked events`);
  (paa?.modifiers||c?.modifiers||[]).forEach(mod=>{
    if(mod?.label) chips.push(mod.label);
  });
  if((paa?.missing_context||[]).length>0) chips.push('Missing context');
  chips.push('Review needed');
  return chips.slice(0,3);
}
function reviewGuideMetricChips(c,paa){
  const chips=[];
  const linked=paa?.linked_event_count||c.event_count||0;
  if(linked) chips.push(`${fmtNum(linked)} records`);
  const role=(paa?.subject_role&&paa.subject_role!=='UNKNOWN')?paa.subject_role:inferRole(c.user_id);
  if(role) chips.push(role);
  chips.push('Review window');
  return chips.slice(0,3);
}

// ─── Case Drawer ──────────────────────────────────────────────────────────────
const DRAWER_W_KEY='tp_drawer_w';
const clampDrawerW=w=>Math.min(Math.max(w,640),Math.floor(window.innerWidth*0.96));

function CaseDrawer({caseId,user,onClose,onDisposed,onRefreshCases}){
  const [dw,setDw]=useState(()=>{
    try{const s=localStorage.getItem(DRAWER_W_KEY);return s?clampDrawerW(parseInt(s)):Math.min(960,Math.floor(window.innerWidth*0.92));}catch{return 920;}
  });
  const isResizing=useRef(false);
  const resizeRef=useRef({x:0,w:0});
  const handleRef=useRef(null);

  const onHandleMouseDown=useCallback(e=>{
    e.preventDefault();
    isResizing.current=true;
    resizeRef.current={x:e.clientX,w:dw};
    if(handleRef.current)handleRef.current.classList.add('active');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
    const onMove=e=>{
      if(!isResizing.current)return;
      const delta=resizeRef.current.x-e.clientX;
      const nw=clampDrawerW(resizeRef.current.w+delta);
      setDw(nw);
      try{localStorage.setItem(DRAWER_W_KEY,nw)}catch{}
    };
    const onUp=()=>{
      isResizing.current=false;
      if(handleRef.current)handleRef.current.classList.remove('active');
      document.body.style.cursor='';
      document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  },[dw]);

  const [detail,setDetail]=useState(null);
  const [loading,setLoading]=useState(true);
  const [loadError,setLoadError]=useState('');
  const [disposition,setDisposition]=useState('');
  const [reasonCode,setReasonCode]=useState('');
  const [reasonOptions,setReasonOptions]=useState([]);
  const [loadingReasons,setLoadingReasons]=useState(false);
  const [notes,setNotes]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [disposed,setDisposed]=useState(false);
  const [reqReason,setReqReason]=useState('');
  const [reqSubmitting,setReqSubmitting]=useState(false);
  const [reqMsg,setReqMsg]=useState(null);
  const [showReqForm,setShowReqForm]=useState(false);
  const [showChecklistModal,setShowChecklistModal]=useState(false);
  const [pendingSuggestedReason,setPendingSuggestedReason]=useState('');
  const [requestedFromRole,setRequestedFromRole]=useState('');
  const [requestedFromEmail,setRequestedFromEmail]=useState('');
  const [contextQuestion,setContextQuestion]=useState('');
  const [actionDueDate,setActionDueDate]=useState('');
  const [escalatedToRole,setEscalatedToRole]=useState('');
  const [escalatedToEmail,setEscalatedToEmail]=useState('');
  const [escalationReason,setEscalationReason]=useState('');
  const [responseDrafts,setResponseDrafts]=useState({});
  const [respondingId,setRespondingId]=useState(null);
  const [actionMsg,setActionMsg]=useState(null);
  const [statusNotice,setStatusNotice]=useState('');
  const [activeTab,setActiveTab]=useState('evidence');
  const [ctxRecommendation,setCtxRecommendation]=useState(null);
  const [copiedGuideMessage,setCopiedGuideMessage]=useState(false);
  const [preparedGuideAction,setPreparedGuideAction]=useState(false);
  const actionFormRef=useRef(null);

  useEffect(()=>{
    if(!caseId)return;
    setLoading(true);setDetail(null);setLoadError('');setDisposed(false);setReqMsg(null);setShowReqForm(false);setShowChecklistModal(false);setPendingSuggestedReason('');setRequestedFromRole('');setRequestedFromEmail('');setContextQuestion('');setActionDueDate('');setEscalatedToRole('');setEscalatedToEmail('');setEscalationReason('');setResponseDrafts({});setRespondingId(null);setActionMsg(null);setStatusNotice('');setDisposition('');setReasonCode('');setReasonOptions([]);setNotes('');setCtxRecommendation(null);setCopiedGuideMessage(false);setPreparedGuideAction(false);
    (async()=>{
      try{
        const d=await apiFetch(`/api/cases/${caseId}`);
        setDetail(d);
      }catch(e){
        const msg=String(e?.message||'');
        if(msg.includes('Case not found')&&onRefreshCases){
          try{
            await onRefreshCases();
            const d=await apiFetch(`/api/cases/${caseId}`);
            setDetail(d);
          }catch{
            setLoadError('This case was refreshed. Please reload the queue.');
          }
        }else{
          setLoadError('Unable to load this case right now.');
        }
      }finally{
        setLoading(false);
      }
    })();
  },[caseId,onRefreshCases]);

  useEffect(()=>{
    if(!disposition){setReasonCode('');setReasonOptions([]);return;}
    setLoadingReasons(true);
    apiFetch(`/api/cases/reason-codes?action=${encodeURIComponent(disposition)}`)
      .then(d=>{
        const options=d.reason_codes||[];
        setReasonOptions(options);
        if(pendingSuggestedReason&&options.some(r=>r.code===pendingSuggestedReason)){setReasonCode(pendingSuggestedReason);setPendingSuggestedReason('');}
        else{setReasonCode('');}
        setLoadingReasons(false);
      })
      .catch(()=>{setReasonOptions([]);setReasonCode('');setLoadingReasons(false);});
  },[disposition,pendingSuggestedReason]);

  async function submitAccessRequest(){
    if(!reqReason.trim()){return;}
    setReqSubmitting(true);
    const r=await apiFetch('/api/privacy/request',{method:'POST',body:{reason:reqReason.trim()}});
    setReqSubmitting(false);
    if(r?.id){setReqMsg({m:'Request submitted - an admin will review it.',ok:true});setShowReqForm(false);setReqReason('');}
    else if(r?.detail?.includes('pending')){setReqMsg({m:'You already have a pending request.',ok:false});}
    else setReqMsg({m:'Failed to submit request.',ok:false});
  }

  async function submitDisposition(){
    if(!disposition)return;
    setSubmitting(true);
    try{
      const previousStatus=detail?.status;
      const resp=await apiFetch(`/api/cases/${caseId}/disposition`,{method:'POST',body:{
        action:disposition,
        reason_code:reasonCode,
        notes,
        requested_from_role:requestedFromRole,
        requested_from_email:requestedFromEmail,
        context_question:contextQuestion,
        due_date:actionDueDate,
        escalated_to_role:escalatedToRole,
        escalated_to_email:escalatedToEmail,
        escalation_reason:escalationReason,
        escalation_due_date:actionDueDate,
        // Recommendation provenance (only sent for REQUEST_CONTEXT)
        suggested_intent:ctxRecommendation?.intent||'',
        suggested_template_id:ctxRecommendation?.template_id||'',
        suggested_template_version:ctxRecommendation?.template_version||'',
        suggested_rationale_labels:ctxRecommendation?.rationale_labels||[],
        generated_question_text:ctxRecommendation?.question_text||'',
      }});
      const updated=await apiFetch(`/api/cases/${caseId}`);
      setDetail(updated);
      setDisposed(true);
      setActionMsg(`Review action recorded: ${resp.action}.`);
      setDisposition('');
      setReasonCode('');
      setReasonOptions([]);
      setNotes('');
      setRequestedFromRole('');
      setRequestedFromEmail('');
      setContextQuestion('');
      setActionDueDate('');
      setEscalatedToRole('');
      setEscalatedToEmail('');
      setEscalationReason('');
      setCtxRecommendation(null);
      if(previousStatus&&resp.new_status&&previousStatus!==resp.new_status){
        setStatusNotice(`Case moved to ${resp.new_status}. It remains available under ${ACTIVE_CASE_STATUSES.has(resp.new_status)?'Active':'its matching lifecycle status filter'}.`);
      }else{
        setStatusNotice('');
      }
      onDisposed&&onDisposed(caseId);
    }catch(e){
      try{const j=JSON.parse(e.message);alert('Disposition failed: '+(j.detail||e.message));}
      catch{alert('Disposition failed: '+e.message);}
    }
    setSubmitting(false);
  }

  async function submitContextResponse(contextRequestId){
    const responseText=(responseDrafts[contextRequestId]||'').trim();
    if(!responseText)return;
    setRespondingId(contextRequestId);
    try{
      await apiFetch(`/api/cases/${caseId}/context_requests/${contextRequestId}/response`,{
        method:'POST',
        body:{response_text:responseText,notes:`Context response recorded for request ${contextRequestId}`},
      });
      const updated=await apiFetch(`/api/cases/${caseId}`);
      setDetail(updated);
      setResponseDrafts(prev=>({...prev,[contextRequestId]:''}));
      setActionMsg('Context response added.');
    }catch(e){
      try{const j=JSON.parse(e.message);alert('Context response failed: '+(j.detail||e.message));}
      catch{alert('Context response failed: '+e.message);}
    }
    setRespondingId(null);
  }

  function applySuggestedAction(action){
    if(!action?.action)return;
    setDisposition(action.action);
    setPendingSuggestedReason('');
    setReasonCode('');
    if(action.action==='REQUEST_CONTEXT'){
      // question_text prefills the context question field
      if(action.question_text){
        setContextQuestion(prev=>prev?.trim()?prev:action.question_text);
      }
      // suggested_requested_from_role prefills the requested-from dropdown
      if(action.suggested_requested_from_role){
        setRequestedFromRole(prev=>prev?.trim()?prev:action.suggested_requested_from_role);
      }
      // suggested_note prefills the notes field
      if(action.suggested_note){
        setNotes(prev=>prev?.trim()?prev:action.suggested_note);
      }
      // Store provenance so it can be submitted with the disposition
      setCtxRecommendation({
        intent: action.intent||action.template_id||'',
        template_id: action.template_id||'',
        template_version: action.template_version||'',
        rationale_labels: action.rationale_labels||[],
        question_text: action.question_text||'',
      });
    }else{
      if(action.suggested_note){
        setNotes(prev=>prev?.trim()?prev:action.suggested_note);
      }
    }
    setShowChecklistModal(false);
    setActionMsg('Action prepared in the review form.');
    setPreparedGuideAction(true);
    window.setTimeout(()=>{
      actionFormRef.current?.scrollIntoView({behavior:'smooth',block:'start'});
      actionFormRef.current?.focus();
    },80);
    window.setTimeout(()=>setPreparedGuideAction(false),1400);
  }

  async function copySuggestedNote(note){
    if(!note)return;
    setNotes(note);
    try{
      if(navigator?.clipboard?.writeText){await navigator.clipboard.writeText(note);}
      setActionMsg('Suggested message copied and added to the notes field.');
    }catch{
      setActionMsg('Suggested message added to the notes field.');
    }
    setCopiedGuideMessage(true);
    window.setTimeout(()=>setCopiedGuideMessage(false),1200);
  }

  const canDispose=hasPermission(user,'disposition');
  const canExport=hasPermission(user,'export');
  const canBreach=hasPermission(user,'breach_assessment');
  const requestContextRoleOptions=['Billing Supervisor','Provider / Physician','Nurse Manager','Clinic Administrator','Privacy Officer','IT / Security Admin','Other'];
  const escalationRoleOptions=['Privacy Officer','Compliance Officer','Clinic Administrator','Billing Supervisor','IT / Security Admin','External Legal / Compliance Consultant','Other'];
  const notesRequiredActions=['REQUEST_CONTEXT','ESCALATED','RESOLVED_AUTHORIZED_ACCESS','RESOLVED_NO_ISSUE','FALSE_POSITIVE','SUPPRESSED','REOPENED'];
  const reasonRequiredActions=['REQUEST_CONTEXT','ESCALATED','RESOLVED_AUTHORIZED_ACCESS','RESOLVED_NO_ISSUE','FALSE_POSITIVE','SUPPRESSED','REOPENED'];
  const c=detail;
  const availableActions=(CASE_ACTION_OPTIONS[c?.status]||[
    ['REVIEW_STARTED','Review started'],
    ['REQUEST_CONTEXT','Request context'],
    ['ESCALATED','Escalated'],
    ['RESOLVED_AUTHORIZED_ACCESS','Resolved - authorized access'],
    ['RESOLVED_NO_ISSUE','Resolved - no issue'],
    ['FALSE_POSITIVE','False positive'],
    ['SUPPRESSED','Suppressed'],
    ['REOPENED','Reopened'],
    ['COMMENT_ADDED','Comment added'],
    ['EVIDENCE_EXPORTED','Evidence exported'],
  ]).filter(([value])=>value!=='SUPPRESSED'||hasPermission(user,'configure'));

  return(
    <>
      <div className="overlay" onClick={onClose}/>
      <div className="drawer slide" style={{width:dw}}>
        <div ref={handleRef} className="drawer-handle" onMouseDown={onHandleMouseDown} title="Drag to resize panel"/>
        {/* ── TYPE ACCENT BAR ── */}
        <div style={{height:3,background:isAuthCase(detail)?'linear-gradient(90deg,#7C3AED,#06B6D4)':'linear-gradient(90deg,#2563EB,#4F46E5)',flexShrink:0}}/>

        {/* ── STICKY CASE HEADER ── */}
        <div style={{flexShrink:0,borderBottom:'1px solid #E8EDF4'}}>
          {/* Title + close */}
          <div style={{padding:'16px 20px 10px',background:'#fff',display:'flex',gap:12,alignItems:'flex-start'}}>
            <div style={{flex:1,minWidth:0}}>
              {loading?(
                <><div className="skeleton" style={{height:18,width:'72%',marginBottom:8}}/><div className="skeleton" style={{height:14,width:'44%'}}/></>
              ):c?(
                <h2 style={{fontSize:16,fontWeight:800,color:'#0F172A',lineHeight:1.35,letterSpacing:'-.02em',
                  overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{c.title}</h2>
              ):(
                <div style={{fontSize:13,color:'#94A3B8'}}>Case Detail</div>
              )}
            </div>
            <button onClick={onClose}
              style={{width:28,height:28,borderRadius:8,border:'none',background:'#F1F5F9',fontSize:17,
                display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'#64748B',
                flexShrink:0,transition:'all .15s'}}
              onMouseEnter={e=>{e.currentTarget.style.background='#E2E8F0';e.currentTarget.style.color='#0F172A'}}
              onMouseLeave={e=>{e.currentTarget.style.background='#F1F5F9';e.currentTarget.style.color='#64748B'}}>×</button>
          </div>
          {/* Badge strip */}
          {c&&(
            <div style={{padding:'0 20px 10px',display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
              <CaseStatusBadge status={c.status}/>
              <Badge sev={c.severity}/>
              <span className="badge" style={{background:'#F1F5F9',color:'#334155',fontSize:10}}>{caseTypeLabel(c.case_type)}</span>
              <PatternBadge pattern={c.pattern_type}/>
              {(c.modifiers||[]).map(mod=>(
                <span key={mod.key||mod.label} className="badge" style={{background:'#E0E7FF',color:'#3730A3'}}>{mod.label}</span>
              ))}
              {c.breach_risk&&<span className="badge" style={{background:'#FEE2E2',color:'#991B1B',fontWeight:700}}>⚠ Breach</span>}
              {c.is_demo&&<span className="badge" style={{background:'#E0E7FF',color:'#3730A3',fontSize:10}}>Demo</span>}
            </div>
          )}
          {/* User identity strip with avatar + risk ring */}
          {c&&(
            <div className="drawer-user-strip">
              <div className="drawer-avatar"
                style={{background:ROLE_COLOR[inferRole(c.user_id)]||'#6366F1',
                  boxShadow:`0 3px 10px ${(ROLE_COLOR[inferRole(c.user_id)]||'#6366F1')}55`}}>
                {(c.user_name||c.user_id||'?')[0].toUpperCase()}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:'#0F172A',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.user_name||c.user_id}</div>
                <div style={{fontSize:11,color:'#64748B',marginTop:1,display:'flex',alignItems:'center',gap:5}}>
                  <RoleBadge role={inferRole(c.user_id)}/>
                  <span style={{color:'#CBD5E1'}}>·</span>
                  <span>opened {fmtRelTime(c.created_at)}</span>
                </div>
              </div>
              <RiskRing score={c.risk_score||0} size={46}/>
            </div>
          )}
        </div>

        <div className="drawer-body">
          {loading&&<Spinner/>}
          {!loading&&!c&&<div style={{color:'#94A3B8',textAlign:'center',padding:'40px 0'}}>{loadError||'Case not found.'}</div>}
          {c&&(
            <div className="fade">

              {/* ── QUICK STATS BAR ── */}
              <div className="stat-row">
                <div className="stat-cell">
                  <div className="stat-cell-lbl"><span style={{fontSize:11}}>⚡</span>Events</div>
                  <div className="stat-cell-val">{fmtNum(c.linked_event_count??c.events?.length??0)}</div>
                </div>
                {!isAuthCase(c)&&Number(c.unique_patient_token_count||0)>0&&(
                  <div className="stat-cell">
                    <div className="stat-cell-lbl"><span style={{fontSize:11}}>👤</span>Patients</div>
                    <div className="stat-cell-val">{fmtNum(c.unique_patient_token_count)}</div>
                  </div>
                )}
                <div className="stat-cell" style={{flex:2}}>
                  <div className="stat-cell-lbl"><span style={{fontSize:11}}>📅</span>Period</div>
                  <div className="stat-cell-val">{fmtDate(c.date_start)} – {fmtDate(c.date_end)}</div>
                </div>
                <div className="stat-cell" style={{flex:2}}>
                  <div className="stat-cell-lbl" style={{color:PATTERN_COLOR[c.pattern_type]||'#94A3B8'}}>
                    <span style={{width:6,height:6,borderRadius:'50%',background:PATTERN_COLOR[c.pattern_type]||'#94A3B8',display:'inline-block',flexShrink:0}}/>
                    Pattern
                  </div>
                  <div className="stat-cell-val">{pLabel(c.pattern_type)}</div>
                </div>
              </div>

              {/* ── WHY THIS NEEDS REVIEW ── */}
              {(c.quick_review_reason||c.patient_access_assessment?.quick_review_reason)&&(
                <div className="why-review">
                  <div style={{fontSize:10,fontWeight:700,color:'#1D4ED8',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:7}}>Why this needs review</div>
                  <div style={{fontSize:13,color:'#1E40AF',lineHeight:1.55,marginBottom:8}}>
                    {c.quick_review_reason||c.patient_access_assessment?.quick_review_reason}
                  </div>
                  {(c.patient_access_assessment?.missing_context?.[0]||c.missing_context?.[0])&&(
                    <div style={{fontSize:12,color:'#2563EB',marginBottom:6}}>
                      Missing information: {c.patient_access_assessment?.missing_context?.[0]?.reason||c.missing_context?.[0]?.reason||'Context was not available.'}
                    </div>
                  )}
                  {c.patient_access_assessment?.primary_suggested_action&&(
                    <div style={{fontSize:12,fontWeight:600,color:'#1E3A8A'}}>
                      Suggested next step: {suggestedNextStepLabel(c,c.patient_access_assessment)}
                    </div>
                  )}
                </div>
              )}

              {/* ── ACTION NOTICES ── */}
              {actionMsg&&<div className="action-notice-ok">{actionMsg}</div>}
              {statusNotice&&<div className="action-notice-info">{statusNotice}</div>}
              {!canDispose&&<div style={{background:'#F8FAFC',border:'1px solid #E2E8F0',borderRadius:10,padding:'9px 14px',marginBottom:12,fontSize:12,color:'#64748B',display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:14}}>👁</span><span>Read-only — your role (<strong>{user?.role?.replace(/_/g,' ')}</strong>) can view cases but not take disposition actions.</span></div>}

              {/* ── TAKE REVIEW ACTION ── */}
              {canDispose&&(
                <div ref={actionFormRef} tabIndex={-1} className="action-panel" style={{outline:'none'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                    <div style={{fontSize:10,fontWeight:800,color:'#4338CA',textTransform:'uppercase',letterSpacing:'.10em'}}>Review Action</div>
                    {disposition&&<button onClick={()=>{setDisposition('');setReasonCode('');setPendingSuggestedReason('');setNotes('');}} style={{fontSize:10,color:'#94A3B8',background:'none',border:'none',cursor:'pointer',padding:0,fontFamily:'inherit',fontWeight:600}}>Clear</button>}
                  </div>
                  {/* Action pill picker */}
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:disposition?14:0}}>
                    {availableActions.map(([value,label])=>{
                      const AP={
                        RESOLVED_AUTHORIZED_ACCESS:{c:'#166534',bg:'#DCFCE7',b:'#86EFAC'},
                        RESOLVED_NO_ISSUE:{c:'#166534',bg:'#F0FDF4',b:'#86EFAC'},
                        FALSE_POSITIVE:{c:'#475569',bg:'#F1F5F9',b:'#CBD5E1'},
                        ESCALATED:{c:'#C2410C',bg:'#FFEDD5',b:'#FDBA74'},
                        REQUEST_CONTEXT:{c:'#1D4ED8',bg:'#DBEAFE',b:'#93C5FD'},
                        REVIEW_STARTED:{c:'#6D28D9',bg:'#EDE9FE',b:'#C4B5FD'},
                        COMMENT_ADDED:{c:'#475569',bg:'#F8FAFC',b:'#E2E8F0'},
                        REOPENED:{c:'#D97706',bg:'#FEF3C7',b:'#FCD34D'},
                        SUPPRESSED:{c:'#7C3AED',bg:'#F5F3FF',b:'#C4B5FD'},
                        EVIDENCE_EXPORTED:{c:'#0891B2',bg:'#ECFEFF',b:'#A5F3FC'},
                      }[value]||{c:'#475569',bg:'#F1F5F9',b:'#E2E8F0'};
                      const on=disposition===value;
                      return(
                        <button key={value} onClick={()=>setDisposition(on?'':value)} className="action-pill"
                          style={{borderColor:on?AP.b:'#E2E8F0',background:on?AP.bg:'rgba(248,250,252,.9)',color:on?AP.c:'#64748B',
                            boxShadow:on?`0 0 0 3px ${AP.b}55`:''}} >
                          {on&&<span style={{marginRight:4}}>✓</span>}{label}
                        </button>
                      );
                    })}
                  </div>
                  {/* Contextual sub-form */}
                  {disposition&&(
                    <div className="fade" style={{display:'flex',flexDirection:'column',gap:11,borderTop:'1px solid #E8EDF4',paddingTop:13}}>
                      <div>
                        <label className="form-lbl">Reason{reasonRequiredActions.includes(disposition)?' *':''}</label>
                        <select value={reasonCode} onChange={e=>setReasonCode(e.target.value)} style={{width:'100%'}} disabled={loadingReasons||reasonOptions.length===0}>
                          <option value="">{loadingReasons?'Loading reasons…':reasonRequiredActions.includes(disposition)?'Select reason…':'No structured reason required'}</option>
                          {reasonOptions.map(r=><option key={r.code} value={r.code}>{r.label}</option>)}
                        </select>
                      </div>
                      {disposition==='REQUEST_CONTEXT'&&(
                        <div style={{border:'1px solid #BFDBFE',borderRadius:10,padding:'13px',background:'#F0F7FF',display:'flex',flexDirection:'column',gap:10}}>
                          <div style={{fontSize:9,fontWeight:800,color:'#1D4ED8',textTransform:'uppercase',letterSpacing:'.10em'}}>Context Request Details</div>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                            <div>
                              <label className="form-lbl">Requested From *</label>
                              <select value={requestedFromRole} onChange={e=>setRequestedFromRole(e.target.value)} style={{width:'100%'}}>
                                <option value="">Select role…</option>
                                {requestContextRoleOptions.map(v=><option key={v} value={v}>{v}</option>)}
                              </select>
                            </div>
                            <div>
                              <label className="form-lbl">Email (optional)</label>
                              <input value={requestedFromEmail} onChange={e=>setRequestedFromEmail(e.target.value)} placeholder="email@clinic.example" style={{width:'100%'}}/>
                            </div>
                          </div>
                          <div>
                            <label className="form-lbl">Suggested context question *</label>
                            {ctxRecommendation?.rationale_labels?.length>0&&(
                              <div style={{fontSize:11,color:'#6366F1',marginBottom:4,fontWeight:600}}>Suggested because: {ctxRecommendation.rationale_labels.join(' · ')}</div>
                            )}
                            <div style={{fontSize:11,color:'#94A3B8',marginBottom:5}}>You can edit this before submitting.</div>
                            <textarea value={contextQuestion} onChange={e=>setContextQuestion(e.target.value)} placeholder="What context do you need from this person?" rows={3} style={{width:'100%',border:'1.5px solid #BFDBFE',borderRadius:8,padding:'8px 12px',fontSize:13,resize:'vertical',fontFamily:'inherit',outline:'none'}}/>
                          </div>
                          <div>
                            <label className="form-lbl">Due Date (optional)</label>
                            <input type="datetime-local" value={actionDueDate} onChange={e=>setActionDueDate(e.target.value)} style={{width:'100%'}}/>
                          </div>
                        </div>
                      )}
                      {disposition==='ESCALATED'&&(
                        <div style={{border:'1px solid #FDE68A',borderRadius:10,padding:'13px',background:'#FFFBEB',display:'flex',flexDirection:'column',gap:10}}>
                          <div style={{fontSize:9,fontWeight:800,color:'#92400E',textTransform:'uppercase',letterSpacing:'.10em'}}>Escalation Details</div>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                            <div>
                              <label className="form-lbl">Escalate To *</label>
                              <select value={escalatedToRole} onChange={e=>setEscalatedToRole(e.target.value)} style={{width:'100%'}}>
                                <option value="">Select role…</option>
                                {escalationRoleOptions.map(v=><option key={v} value={v}>{v}</option>)}
                              </select>
                            </div>
                            <div>
                              <label className="form-lbl">Email (optional)</label>
                              <input value={escalatedToEmail} onChange={e=>setEscalatedToEmail(e.target.value)} placeholder="email@clinic.example" style={{width:'100%'}}/>
                            </div>
                          </div>
                          <div>
                            <label className="form-lbl">Escalation Reason *</label>
                            <textarea value={escalationReason} onChange={e=>setEscalationReason(e.target.value)} placeholder="Why is this being escalated?" rows={3} style={{width:'100%',border:'1.5px solid #FDE68A',borderRadius:8,padding:'8px 12px',fontSize:13,resize:'vertical',fontFamily:'inherit',outline:'none'}}/>
                          </div>
                          <div>
                            <label className="form-lbl">Due Date (optional)</label>
                            <input type="datetime-local" value={actionDueDate} onChange={e=>setActionDueDate(e.target.value)} style={{width:'100%'}}/>
                          </div>
                        </div>
                      )}
                      <div>
                        <label className="form-lbl">Notes{notesRequiredActions.includes(disposition)?' *':''}</label>
                        <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder={notesRequiredActions.includes(disposition)?'Notes are required for this action…':'Notes (optional)…'} rows={3} style={{width:'100%',border:'1.5px solid #E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,resize:'vertical',fontFamily:'inherit',outline:'none'}}/>
                      </div>
                      <div style={{display:'flex',justifyContent:'flex-end'}}>
                        <button className="btn-primary" onClick={submitDisposition}
                          disabled={!disposition||submitting||(reasonRequiredActions.includes(disposition)&&!reasonCode)||(disposition==='REQUEST_CONTEXT'&&(!requestedFromRole||!contextQuestion.trim()))||(disposition==='ESCALATED'&&(!escalatedToRole||!escalationReason.trim()))}
                          style={{padding:'9px 24px'}}>
                          {submitting?'Saving…':'Record Review Action'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ── TAB BAR ── */}
              <div className="tab-bar">
                {[['evidence','Evidence'],['workflow','Workflow'],['context','Context'],['technical','Technical']].map(([k,l])=>(
                  <button key={k} onClick={()=>setActiveTab(k)} className={`tab-btn${activeTab===k?' active':''}`}>{l}</button>
                ))}
              </div>

              {/* ── EVIDENCE TAB ── */}
              {activeTab==='evidence'&&(
                <div className="fade">
                  {c.events?.length>0?(
                    <div style={{border:'1px solid #E2E8F0',borderRadius:12,overflow:'hidden',background:'#fff',marginBottom:10}}>
                      <div style={{overflowX:'auto'}}>
                        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                          <thead>
                            <tr style={{background:'linear-gradient(to right,#F8FAFC,#F1F5F9)'}}>
                              {[['#','Log ID'],['⊞','Manifest'],['◎','User'],['◷','Time'],['⚡','Event Type'],['◈','Patient Token'],['◐','Rule']].map(([ic,h])=>(
                                <th key={h} style={{textAlign:'left',padding:'10px 12px',color:'#64748B',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',borderBottom:'2px solid #E2E8F0',whiteSpace:'nowrap'}}>
                                  <span style={{marginRight:4,opacity:.55,fontSize:11}}>{ic}</span>{h}
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {c.events.slice(0,10).map((e,i)=>{
                              const evColor=PATTERN_COLOR[e.event_type]||'#64748B';
                              const isEven=i%2===0;
                              return(
                                <tr key={`${e.id||e.source_log_id||i}-${i}`}
                                  style={{borderBottom:i===Math.min(c.events.length,10)-1?'none':'1px solid #F1F5F9',background:isEven?'#fff':'#FAFAFA',transition:'background .1s'}}
                                  onMouseEnter={ev=>ev.currentTarget.style.background='#F0F4FF'}
                                  onMouseLeave={ev=>ev.currentTarget.style.background=isEven?'#fff':'#FAFAFA'}>
                                  <td style={{padding:'9px 12px',color:'#1E293B',fontFamily:'monospace',whiteSpace:'nowrap',fontSize:10,maxWidth:90,overflow:'hidden',textOverflow:'ellipsis'}}>{e.source_log_id??'-'}</td>
                                  <td style={{padding:'9px 12px',color:'#64748B',fontFamily:'monospace',whiteSpace:'nowrap',fontSize:10,maxWidth:90,overflow:'hidden',textOverflow:'ellipsis'}}>{e.manifest_id??'-'}</td>
                                  <td style={{padding:'9px 12px',whiteSpace:'nowrap'}}><span style={{fontSize:12,fontWeight:600,color:'#334155'}}>{e.source_username||e.user_id||'-'}</span></td>
                                  <td style={{padding:'9px 12px',whiteSpace:'nowrap'}}>
                                    <div style={{fontSize:11,fontWeight:600,color:'#334155'}}>{e.event_time?fmtTime(e.event_time):'-'}</div>
                                    {e.event_time&&<div style={{fontSize:10,color:'#94A3B8',marginTop:1}}>{fmtRelTime(e.event_time)}</div>}
                                  </td>
                                  <td style={{padding:'9px 12px',whiteSpace:'nowrap'}}>
                                    {e.event_type?<span style={{display:'inline-block',padding:'2px 8px',borderRadius:5,fontSize:10,fontWeight:700,background:evColor+'18',color:evColor,border:`1px solid ${evColor}28`,letterSpacing:'.03em'}}>{e.event_type}</span>:'-'}
                                  </td>
                                  <td style={{padding:'9px 12px',fontFamily:'monospace',fontSize:10,whiteSpace:'nowrap'}}>
                                    {e.patient_token?<span style={{background:'#F1F5F9',borderRadius:4,padding:'2px 6px',border:'1px solid #E2E8F0',color:'#475569'}}>{e.patient_token}</span>:'-'}
                                  </td>
                                  <td style={{padding:'9px 12px',fontSize:11,color:'#6366F1',fontFamily:'monospace',maxWidth:110,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.rule_id||e.linked_reason||'-'}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                      <div style={{padding:'10px 16px',borderTop:'1px solid #E2E8F0',background:'#F8FAFC',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <span style={{width:7,height:7,background:'#22C55E',borderRadius:'50%',display:'inline-block',flexShrink:0}}/>
                          <span style={{fontSize:12,color:'#475569'}}>{Math.min(10,c.events.length)} of <strong>{fmtNum(c.events.length)}</strong> linked events · patient IDs tokenized</span>
                        </div>
                        {canExport?(
                          <button style={{display:'inline-flex',alignItems:'center',gap:6,padding:'7px 16px',background:'linear-gradient(135deg,#4F46E5,#6366F1)',color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer',boxShadow:'0 2px 8px rgba(99,102,241,.30)',whiteSpace:'nowrap'}} onClick={async()=>{
                            const res=await fetch(`/api/evidence/${caseId}`,{headers:{Authorization:`Bearer ${getToken()}`}});
                            if(!res.ok){alert(`Evidence export failed: ${await res.text()}`);return;}
                            const html=await res.text();
                            window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})),'_blank');
                          }}>⬇ Export Evidence Package</button>
                        ):(
                          <span style={{fontSize:11,color:'#94A3B8',fontStyle:'italic'}}>Export requires the <strong>export</strong> permission</span>
                        )}
                      </div>
                    </div>
                  ):(
                    <div style={{border:'1px dashed #E2E8F0',borderRadius:12,padding:'36px 24px',textAlign:'center',background:'#FAFAFA'}}>
                      <div style={{fontSize:28,marginBottom:8,opacity:.35}}>🗂</div>
                      <div style={{fontSize:13,fontWeight:600,color:'#475569',marginBottom:4}}>No linked evidence events</div>
                      <div style={{fontSize:12,color:'#94A3B8'}}>Events link to cases when ingestion rules match audit log entries.</div>
                    </div>
                  )}
                </div>
              )}

              {/* ── WORKFLOW TAB ── */}
              {activeTab==='workflow'&&(
                <div className="fade">
                  {c.patient_access_assessment&&(
                    <div style={{borderRadius:14,marginBottom:20,overflow:'hidden',boxShadow:'0 2px 14px rgba(37,99,235,.13)'}}>
                      <div style={{background:'linear-gradient(135deg,#2563EB 0%,#4F46E5 100%)',padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:14}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:10,fontWeight:800,color:'rgba(255,255,255,.65)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>Quick Review Guide</div>
                          <div style={{fontSize:14,color:'#fff',lineHeight:1.55,fontWeight:500}}>
                            {c.patient_access_assessment.quick_review_reason||c.patient_access_assessment.summary}
                          </div>
                        </div>
                        <button style={{padding:'8px 16px',borderRadius:9,border:'2px solid rgba(255,255,255,.35)',background:'rgba(255,255,255,.1)',color:'#fff',cursor:'pointer',fontSize:12,fontWeight:700,flexShrink:0,whiteSpace:'nowrap',transition:'background .15s'}}
                          onMouseEnter={e=>e.target.style.background='rgba(255,255,255,.2)'}
                          onMouseLeave={e=>e.target.style.background='rgba(255,255,255,.1)'}
                          onClick={()=>setShowChecklistModal(true)}>Open Review Guide →</button>
                      </div>
                      <div style={{background:'#EFF6FF',padding:'10px 20px',borderTop:'1px solid #BFDBFE',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                        <span style={{fontSize:11,color:'#64748B',fontWeight:500}}>Suggested next step:</span>
                        <span style={{fontSize:12,fontWeight:700,color:'#1D4ED8',background:'#DBEAFE',padding:'2px 11px',borderRadius:99,border:'1px solid #BFDBFE'}}>{suggestedNextStepLabel(c,c.patient_access_assessment)||'Review'}</span>
                      </div>
                    </div>
                  )}
                  {c.action_history?.length>0?(
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:14}}>Review Action History</div>
                      <div className="tl">
                        {c.action_history.map((a,i)=>{
                          const ai=ACTION_ICON[a.action]||{icon:'·',color:'#94A3B8'};
                          return(
                          <div key={a.id||i} className="tl-item">
                            <div className="tl-dot" style={{background:ai.color,boxShadow:`0 0 0 3px ${ai.color}25`,border:'2px solid #fff',top:8}}/>
                            <div style={{background:'#fff',borderRadius:12,padding:'12px 15px',border:'1px solid #E8EDF4',boxShadow:'0 1px 4px rgba(15,23,42,.04)',transition:'box-shadow .12s'}}
